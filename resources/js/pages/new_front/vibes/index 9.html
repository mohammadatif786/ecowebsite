  .btn-ghost:hover{background:#f8fafc}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hide-scroll::-webkit-scrollbar{display:none}
  .hide-scroll{-ms-overflow-style:none;scrollbar-width:none}

// Pulls the restaurant owner's Menu Builder data (LinkUp-Eats-BackOffice.html —
// localStorage['lk_eats_restaurant_profile'] / ['lk_eats_admin_menu']) in as a real, orderable
// restaurant here, alongside the demo ones. Re-reads localStorage fresh on every load, so future
// menu edits in the Back Office show up automatically — no rebuild needed. SEED.restaurants has
// no persistence of its own (resets to the hardcoded 4 every reload), so this just needs to run
// once at load time; sentinel id 901 keeps it out of the way of the demo restaurants (ids 1-4).
(function syncBackOfficeRestaurantIntoEats(){
  try{
    const profileRaw = localStorage.getItem('lk_eats_restaurant_profile');
    if(!profileRaw) return;
    const profile = JSON.parse(profileRaw);
    if(!profile || !profile.name) return;
    const boMenu = JSON.parse(localStorage.getItem('lk_eats_admin_menu')||'[]');
    const sections = {};
    boMenu.filter(item=>item.available!==false).forEach(item=>{
      const sec = item.category || 'Menu';
      if(!sections[sec]) sections[sec]=[];
      sections[sec].push({n:item.name, p:item.priceUSD, d:item.desc||'', stock:item.inventory, img:item.image||''});
    });
    SEED.restaurants = SEED.restaurants.filter(r=>r.id!==901);
    SEED.restaurants.unshift({
      id:901, name:profile.name, cuisine:profile.cuisine||'',
      tags:profile.cuisine?[profile.cuisine.split('·')[0].trim()]:[],
      rating:4.8, eta:'20–30 min', fee:2.5, km:1.0,
      image:profile.logo||PIC('rs-backoffice',700,450),
      menu:Object.keys(sections).map(sec=>({sec,items:sections[sec]}))
    });
  }catch(e){ console.warn('Back Office Eats sync skipped:', e); }
})();

// Real trending tags, derived from what people actually type in captions (#hashtag), not a
// hardcoded list. Popularity is a live count across every post, so a tag only "trends" because
// people are actually using it — and using a trending tag is what gives a post more visibility,
// since clicking a tag filters the feed down to posts carrying it.
function extractTags(caption){ return ((caption||'').match(/#[a-z0-9_]+/gi)||[]).map(t=>t.toLowerCase()); }
function trendingTags(posts,limit){
  const counts={};
  posts.forEach(p=>{ extractTags(p.caption).forEach(t=>{ counts[t]=(counts[t]||0)+1; }); });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit||7);
}

function saveUVibePost(){

function userPostsWeb(handle){

function vibesPeopleWeb(){

  SEED.stories.forEach(s=>{if(!map[s.handle])map[s.handle]={handle:s.handle,avatar:s.avatar};});

function vibeFollowingAll(){return DB.get('lk_vibe_following',{});}
function vibeIsFollowing(handle){return !!vibeFollowingAll()[handle];}
function vibeFollowerCountWeb(handle){return 60+(hashSeed(handle)%3200)+(vibeIsFollowing(handle)?1:0);}
function vibeToggleFollowWeb(handle){

const VIBE_CATEGORIES_WEB=['Creator','Artist','Traveler','Foodie','DJ','Photographer','Dancer','Chef'];
function vibeCategoryWeb(handle){return VIBE_CATEGORIES_WEB[hashSeed(handle+'c')%VIBE_CATEGORIES_WEB.length];}
function vibeMutualsLineWeb(handle){

  const extra=3+(seed%27);
  const avs=[a,b].map(p=>`<img src="${p.avatar}" class="h-6 w-6 rounded-full object-cover border-2 border-white -ml-1.5 first:ml-0"/>`).join('');
  return `<div class="flex items-center gap-2"><div class="flex">${avs}</div><p class="text-[13px] text-slate-500">Followed by <b class="text-slate-700">${a.handle.replace(/^@/,'')}</b>, <b class="text-slate-700">${b.handle.replace(/^@/,'')}</b> and ${extra} others</p></div>`;
}

// Top Vibes Senders — a lightweight, deterministic-fake leaderboard (same seeded-fake
// approach as vibeFollowerCountWeb) since there's no real cross-user gift ledger to query;
// pure social-proof texture, not tied to actual giftActivity (which only tracks the
// logged-in user's own sent/received gifts).
const VIBE_SUPPORTER_POOL_WEB=['Aaliyah','Marcus','Simone','Renee','Devon','Kayla','Chris','Nadia','Josh','Tia'];
function vibeTopSendersWeb(handle){
  const seed=hashSeed(handle+'ldb'); const picks=[];
  for(let i=0;i<3;i++){
    const idx=(seed+i*13)%VIBE_SUPPORTER_POOL_WEB.length;
    picks.push([VIBE_SUPPORTER_POOL_WEB[idx], 200+((seed*(i+2))%1800)]);
  }
  picks.sort((a,b)=>b[1]-a[1]);
  return picks;
}

// Repost — copies someone else's post onto your own page, same as Instagram/Twitter reposts:
// a new lk_vibes_posts entry under YOUR handle, pointing back at the original via repostOf.
function repostVibe(id){
  const posts=DB.get('lk_vibes_posts',SEED.vibes_posts);
  const p=posts.find(x=>x.id===id); if(!p)return;
  if(p.handle===USER.handle){ toast("That's already your own post"); return; }
  posts.unshift({
    id:Date.now(), handle:USER.handle, avatar:USER.avatar, org:null, location:p.location,
    kind:p.kind, imgs:p.imgs||[p.media], media:p.media, realVideo:p.realVideo, caption:p.caption,
    likes:0, comments:0, bigup:0, shoppable:false, tag:null,
    repostOf:{id:p.id, handle:p.handle, avatar:p.avatar}
  });
  p.reposts=(p.reposts||0)+1;
  DB.set('lk_vibes_posts',posts);
  toast('🔁 Reposted to your page');
  render();
  try {
    fetch(LINKUP_WEB + '/api/vibes/posts/' + id + '/repost', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ userId: lkUserId() })
    }).catch(function(){});
  } catch (e) {}
}

let lkFilter={ageMin:15,ageMax:40,distMin:0,distMax:100,gender:'both',countryMode:'all',country:'',interests:[],languages:[],religions:[],goals:[]};
let lkDraft=null;
function lkPass(i){const p=PROFILES[i],f=lkFilter;
  if(p.age<f.ageMin||p.age>f.ageMax)return false;
  if(p.km<f.distMin||p.km>f.distMax)return false;
  if(f.gender!=='both'&&p.gender!==f.gender)return false;
  if(f.countryMode==='other'&&f.country&&p.country!==f.country)return false;
  if(f.interests.length&&!f.interests.some(x=>(p.interests||[]).includes(x)))return false;
  if(f.languages.length&&!f.languages.some(x=>(p.languages||[]).includes(x)))return false;
  if(f.religions.length&&!f.religions.includes(p.religion))return false;
  if(f.goals.length&&!f.goals.includes(p.goal))return false;
  return true;
}
function lkFilteredIdxs(){return PROFILES.map((_,i)=>i).filter(lkPass);}

function lkList(idxs,title,sub,kind){

function lkChatsList(){

function waEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nowHM(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0':'')+m+' '+ap;}
function tick(status){if(!status)return '';if(status==='sent')return ' <span style="color:rgba(255,255,255,.7)">✓</span>';if(status==='delivered')return ' <span style="color:rgba(255,255,255,.7)">✓✓</span>';return ' <span style="color:#7fe0ff">✓✓</span>';}

function setLkTab(t){lkTab=t;chatWith=null;render();}
function openChat(name){chatWith=name;lkTab='chats';ensureChat(name);render();}
function closeChat(){chatWith=null;render();}
function waReply(){const r=['For real? 😄','Yes! Let’s link up','Haha true','Sounds good 🔥','Where you want to meet?','I’m down for that 🙌'];return r[Math.floor(Math.random()*r.length)];}
function sendChat(){const inp=$('lkChatInput');const t=(inp&&inp.value||'').trim();if(!t)return;
  pushMsg(chatWith,{from:'me',text:t,t:nowHM(),status:'sent'}); render();
  const who=chatWith;
  setTimeout(()=>{
    const all=DB.get('lk_chats',{}); if(all[who]){all[who].forEach(m=>{if(m.from==='me')m.status='read';}); DB.set('lk_chats',all);}
    const reply=waReply();
    pushMsg(who,{from:'them',text:reply,t:nowHM()});
    pushNotif('message','New message from '+who,reply,who);
    if(chatWith===who)render();
  },900);
}
function chatAttach(kind){
  const map={emoji:{text:'😊🎉🔥'},gif:{img:PIC('gif'+Date.now(),300,200)},photo:{img:PIC('ph'+Date.now(),320,230)},pdf:{text:'📎 flyer.pdf'},location:{text:'📍 Shared location · '+USER.city},ticket:{text:'🎟️ Carnival Fete 2026 · $35'}};
  pushMsg(chatWith,Object.assign({from:'me',t:nowHM(),status:'sent'},map[kind])); render();
}

function lkRangeRow(kind,label,min,max){
  const lo=kind==='age'?lkDraft.ageMin:lkDraft.distMin, hi=kind==='age'?lkDraft.ageMax:lkDraft.distMax;
  const loPct=(lo-min)/(max-min)*100, hiPct=(hi-min)/(max-min)*100;
  return `<div><p class="font-bold mb-3">${label}</p>
    <div class="relative h-6">
      <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1.5 bg-slate-700 rounded-full"></div>
      <div id="${kind}Bar" class="absolute top-1/2 -translate-y-1/2 h-1.5 bg-lkblue rounded-full" style="left:${loPct}%;right:${100-hiPct}%"></div>
      <input type="range" min="${min}" max="${max}" value="${lo}" oninput="lkRangeSet('${kind}','min',this.value)" class="dualrange"/>
      <input type="range" min="${min}" max="${max}" value="${hi}" oninput="lkRangeSet('${kind}','max',this.value)" class="dualrange"/>
    </div>
    <div class="flex justify-between mt-2"><span id="${kind}MinLabel" class="bg-white text-lkink text-sm font-black rounded-lg px-3 py-1.5 border border-slate-200">${lo}</span><span id="${kind}MaxLabel" class="bg-white text-lkink text-sm font-black rounded-lg px-3 py-1.5 border border-slate-200">${hi}</span></div>
  </div>`;
}
function lkRangeSet(kind,which,v){
  v=+v; const minKey=kind==='age'?'ageMin':'distMin', maxKey=kind==='age'?'ageMax':'distMax';
  if(which==='min')lkDraft[minKey]=Math.min(v,lkDraft[maxKey]-1); else lkDraft[maxKey]=Math.max(v,lkDraft[minKey]+1);
  const min=kind==='age'?15:0, max=kind==='age'?70:100;
  const lo=lkDraft[minKey], hi=lkDraft[maxKey];
  const loPct=(lo-min)/(max-min)*100, hiPct=(hi-min)/(max-min)*100;
  const bar=$(kind+'Bar'); if(bar){bar.style.left=loPct+'%';bar.style.right=(100-hiPct)+'%';}
  const loLbl=$(kind+'MinLabel'), hiLbl=$(kind+'MaxLabel'); if(loLbl)loLbl.textContent=lo; if(hiLbl)hiLbl.textContent=hi;
}

function aiEvSearch(q){ if(!q){render();return;} const s=q.toLowerCase(); let list=allEvents().slice(); const filters=[];
  const under=s.match(/(?:under|below|less than|max)\s*\$?\s*(\d+)/);
  if(/\bfree\b/.test(s)){list=list.filter(e=>e.price===0);filters.push('free');}
  else if(under){const cap=+under[1];list=list.filter(e=>e.price<=cap);filters.push('under $'+cap);}
  else if(/cheap|budget|affordable/.test(s)){list=list.filter(e=>e.price<=30);filters.push('under $30');}
  if(/spa|wellness|massage|relax/.test(s)){list=list.filter(e=>/wellness|spa/i.test(e.category+e.title));filters.push('wellness & spa');}
  if(/cookout|bbq|grill|food/.test(s)){list=list.filter(e=>/cookout|food/i.test(e.category+e.title));filters.push('cookouts & food');}
  if(/fete|party|soca|carnival|dance/.test(s)){list=list.filter(e=>/party|fete|dancing|soca|carnival/i.test(e.category+e.title));filters.push('fêtes & parties');}
  if(/online|virtual|stream/.test(s)){list=list.filter(e=>e.kind==='online');filters.push('online');}
  const sec=document.getElementById('evSections'); if(!sec)return;
  const cards=list.length?list:allEvents().slice(0,4);
  const summary=list.length?`Found ${list.length} event${list.length>1?'s':''}${filters.length?' · '+filters.join(' · '):''} for “${q}”`:`No exact match for “${q}” — popular picks you might like`;
  sec.innerHTML=`<div class="card p-3 mb-4 flex items-start gap-2" style="border-color:rgba(47,155,239,.35)"><i data-lucide="sparkles" class="w-5 h-5 text-lkblue shrink-0 mt-0.5"></i><div class="min-w-0"><p class="font-black text-sm">AI Event Search</p><p class="text-[12px] text-slate-500">${summary}</p></div><button onclick="render()" class="ml-auto text-lkblue2 text-xs font-black underline">Clear</button></div><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">${cards.map(evCard).join('')}</div>`;
  if(window.lucide)lucide.createIcons();
}

// No lat/lng entry — organizers don't know their venue's coordinates. Instead, the typed
// address drives a live Google Maps embed (no API key needed for a basic /maps?q= embed)

function ceUpdateMapPreview(){
  const wrap=$('ceMapPreviewWrap'); if(!wrap) return;
  const addr=($('ceVenueLoc')||{}).value||'';
  if(!addr.trim()){ wrap.innerHTML='<div class="rounded-2xl bg-blue-50 border border-blue-100 grid place-items-center text-blue-300 text-xs font-bold" style="height:140px">Enter an address to preview the map</div>'; return; }
  const q=encodeURIComponent(addr);
  wrap.innerHTML=`<div class="rounded-2xl overflow-hidden border border-slate-200"><iframe src="https://www.google.com/maps?q=${q}&output=embed" style="width:100%;height:160px;border:0" loading="lazy"></iframe><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 bg-slate-50 px-4 py-2.5 text-sm font-black text-lkblue"><i data-lucide="map-pin" class="w-4 h-4"></i> Open in Google Maps</a></div>`;
  if(window.lucide) lucide.createIcons();
}
function saveEvent(){ceSave();const n=(ceDraft.ceName||'').trim();if(!n){toast('Enter an event name');return;}
  const list=DB.get('lk_events',[]);
  const editIdx=ceEditId?list.findIndex(e=>String(e.id)===String(ceEditId)):-1;
  const commission=evCommMode==='pct'?(parseFloat(ceDraft.ceComm)||0):0, commFlat=evCommMode==='flat'?(parseFloat(ceDraft.ceFlat)||0):0;
  const composedLoc=[ceDraft.ceCity,ceDraft.ceState,ceDraft.ceCountry].filter(Boolean).join(', ');
  const effDate=ceDraft.ceType==='recurring'?(ceDraft.ceRecStart||'2026-12-31'):(ceDraft.ceDate||'2026-12-31');
  const extra={
    kind:ceDraft.ceVenueType==='online'?'online':'in-person',
    desc:ceDraft.ceDesc||'', audiences:ceDraft.ceAudiences||['Adults'], showAttendees:ceDraft.ceAttendees||'show',
    reviewsEnabled:(ceDraft.ceReviews||'enable')==='enable', seating:ceDraft.ceSeating||'no',
    eventType:ceDraft.ceType||'single', recurrence:ceDraft.ceType==='recurring'?{pattern:ceDraft.ceRecPattern||'Daily',start:ceDraft.ceRecStart||'',end:ceDraft.ceRecEnd||''}:null,
    visibility:ceDraft.ceVisibility||'public', contactEmail:ceDraft.ceEmail||'', contactPhone:ceDraft.cePhone||'', website:ceDraft.ceWebsite||'',
    country:ceDraft.ceCountry||'', state:ceDraft.ceState||'', city:ceDraft.ceCity||'',
    taxIncluded:ceDraft.ceTaxes==='yes', taxRate:ceDraft.ceTaxes==='yes'?(parseFloat(ceDraft.ceTaxRate)||0):0,
    disclaimer:ceDraft.ceDisclaimer||'', gallery:ceDraft.ceGallery||[], artists:ceDraft.ceArtists||[],
    venueType:ceDraft.ceVenueType||'venue', venueLocation:ceDraft.ceVenueLoc||'', reservedSeating:!!ceDraft.ceReserved,
    scanners:ceDraft.ceScanners||[USER.name],
    social:{x:ceDraft.ceSocialX||'', instagram:ceDraft.ceSocialInstagram||'', facebook:ceDraft.ceSocialFacebook||'', tiktok:ceDraft.ceSocialTiktok||'', linkedin:ceDraft.ceSocialLinkedin||''}
  };
  let ev;
  if(editIdx>-1){
    ev=Object.assign({},list[editIdx],{title:n, category:ceDraft.ceCat||list[editIdx].category, date:effDate, price:parseFloat(ceDraft.cePrice)||0, location:composedLoc||list[editIdx].location, image:ceDraft.ceImage||list[editIdx].image, commMode:evCommMode, commission, commFlat, updatedAt:Date.now()}, extra);
    list[editIdx]=ev;
  }else{
    ev={id:'e'+Date.now(), title:n, category:ceDraft.ceCat||'Party/Fete', date:effDate, price:parseFloat(ceDraft.cePrice)||0,
      location:composedLoc||USER.city, organizer:USER.name, image:ceDraft.ceImage||PIC('ue'+Date.now(),800,500), status:'live',
      commMode:evCommMode, commission, commFlat, createdAt:Date.now(), updatedAt:Date.now()};
    Object.assign(ev,extra);
    list.unshift(ev);
  }
  if(ceDraft.ceReserved && ceDraft.ceSeatingLayout){ saveSeatingLayout(ev.id, ceDraft.ceSeatingLayout); }
  DB.set('lk_events',list);
  const wantsLive=ceDraft.ceVenueType==='online' && ceDraft.ceHostLive!==false;
  const liveList=DB.get('lk_live_sessions',[]);
  const liveIdx=ev.liveSessionId?liveList.findIndex(l=>l.id===ev.liveSessionId):-1;
  if(wantsLive){
    const liveCat=ceDraft.ceLiveCat||'Just Chatting';
    if(liveIdx>-1){ liveList[liveIdx]=Object.assign({},liveList[liveIdx],{title:ev.title, category:liveCat, thumb:ev.image, when:fmtDate(ev.date)+', 2026'}); }
    else{ ev.liveSessionId='lv'+Date.now(); liveList.unshift({id:ev.liveSessionId, title:ev.title, host:USER.handle, category:liveCat, viewers:0, likes:0, gifts:0, thumb:ev.image, status:'upcoming', when:fmtDate(ev.date)+', 2026', eventId:ev.id}); }
    DB.set('lk_live_sessions',liveList); DB.set('lk_events',list);
  } else if(liveIdx>-1){
    liveList.splice(liveIdx,1); DB.set('lk_live_sessions',liveList);
    delete ev.liveSessionId; DB.set('lk_events',list);
  }
  const wasEdit=editIdx>-1;
  ceDraft={};ceEditId=null;closeModal();evMenu='Event';current='events';render();
  const portalEl=document.getElementById('orgPortal');
  if(portalEl&&portalEl.style.display==='block'){
    orgPortalView = wasEdit ? 'my-events' : (ev.category==='Cookouts/Food' ? 'home-cookouts' : ev.category==='Wellness & Spa' ? 'home-wellness' : 'home-events');
    showOrgPortal();
  }
  toast(wasEdit?'✅ "'+n+'" updated':'✅ "'+n+'" published'+(evCommMode==='none'?' · no promoter commission':' · promoters earn '+tagCommShort(ev)));
}

/* ===== Reserved Seating — visual floor plan editor (tables + sections), per event. Ported
   from the Admin Dashboard's identical feature — same lk_event_seating_<eventId> storage shape
   so an event's layout is readable from either tool.
   Two contexts share this same set of functions via seatingEditMode:
   - 'draft'  — embedded inline in the Create/Edit Event form (design your layout before ever
     publishing). Operates on ceDraft.ceSeatingLayout in memory; re-renders via the form's own
     openCreateEvent(true), the same mechanism every other field in that form already uses.
   - 'saved'  — the post-publish "Seating layout" menu action, for editing an already-published
     event's layout. Operates directly on lk_event_seating_<eventId>, re-rendering its own modal.
   saveEvent() commits ceDraft.ceSeatingLayout to lk_event_seating_<id> once the real id is known,
   and orgEditEvent() rehydrates ceDraft.ceSeatingLayout from storage when editing an existing
   event, same as every other field reverse-populates. See the drag-via-direct-style-update
   rationale in seatingDragMove below. ===== */
function getSeatingLayout(eventId){ return DB.get('lk_event_seating_'+eventId, {sections:[]}); }
function saveSeatingLayout(eventId,layout){ DB.set('lk_event_seating_'+eventId, layout); }
let seatingEditEventId=null, seatingSelectedId=null, seatDrag=null, seatingEditMode='draft';
const SEATING_DEFAULTS={
  table:{shape:'circle', w:10, h:10, capacity:6, price:500, color:'#f59e0b'},
  section:{shape:'rect', w:30, h:15, capacity:50, price:50, color:'#2563eb'}
};
function seatingLayoutGet(){
  if(seatingEditMode==='draft'){ if(!ceDraft.ceSeatingLayout) ceDraft.ceSeatingLayout={sections:[]}; return ceDraft.ceSeatingLayout; }
  return getSeatingLayout(seatingEditEventId);
}
function seatingLayoutSet(layout){
  if(seatingEditMode==='draft'){ ceDraft.ceSeatingLayout=layout; }
  else { saveSeatingLayout(seatingEditEventId,layout); }
}
function seatingRerender(){
  if(seatingEditMode==='draft'){ openCreateEvent(true); }
  else { openModal(seatingEditorHTML()); if(window.lucide) lucide.createIcons(); }
}
function openSeatingEditor(eventId){
  seatingEditMode='saved'; seatingEditEventId=eventId; seatingSelectedId=null;
  openModal(seatingEditorHTML());
  if(window.lucide) lucide.createIcons();
}
function seatingCanvasHTML(){
  const layout=seatingLayoutGet();
  const selected=layout.sections.find(s=>s.id===seatingSelectedId);
  return `<div class="flex gap-2 mb-3">
      <button type="button" onclick="seatingAdd('table')" class="rounded-xl bg-amber-500 text-white px-4 py-2 text-sm font-black">+ Add Table</button>
      <button type="button" onclick="seatingAdd('section')" class="rounded-xl bg-lkblue text-white px-4 py-2 text-sm font-black">+ Add Section</button>
    </div>
    <div id="seatingCanvas" onmousemove="seatingDragMove(event)" onmouseup="seatingDragEnd()" onmouseleave="seatingDragEnd()" class="relative rounded-2xl border-2 border-slate-200 bg-slate-50" style="height:380px;">
      <div class="absolute left-1/2 -translate-x-1/2 top-2 rounded-full bg-slate-800 text-white text-xs font-black px-6 py-1.5">STAGE</div>
      ${layout.sections.map(s=>seatingElementHTML(s)).join('')}
    </div>
    ${selected?seatingEditPanelHTML(selected):'<p class="text-slate-400 text-sm font-bold mt-3">Click a table or section to edit it.</p>'}`;
}
function seatingEditorHTML(){
  return `<div>
    <div class="p-6 bg-gradient-to-r from-lkblue to-indigo-500 text-white flex items-center justify-between">
      <div><h3 class="text-2xl font-black">Seating Layout</h3><p class="text-blue-100 text-sm">Drag tables/sections to arrange your venue. Click one to edit it.</p></div>
      <button onclick="closeModal()" class="h-11 w-11 rounded-2xl bg-white/20 grid place-items-center"><i data-lucide="x" class="w-6 h-6"></i></button>
    </div>
    <div class="p-6">${seatingCanvasHTML()}</div>
  </div>`;
}
function seatingElementHTML(s){
  const isSel=s.id===seatingSelectedId;
  const radius=s.shape==='circle'?'border-radius:9999px;':'border-radius:12px;';
  return `<div data-seat-id="${s.id}" onmousedown="seatingDragStart(event,'${s.id}')" onclick="seatingSelect('${s.id}')" style="position:absolute;left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%;background:${s.color};${radius}cursor:grab;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;box-sizing:border-box;${isSel?'outline:3px solid #4f46e5;outline-offset:2px;':''}" class="text-white text-[11px] font-black select-none">${s.label}<br>(${s.sold||0}/${s.capacity})</div>`;
}
function seatingEditPanelHTML(s){
  return `<div class="mt-4 rounded-2xl bg-white border border-slate-200 p-4 grid grid-cols-2 md:grid-cols-4 gap-3 items-end">
    <div class="col-span-2"><label class="text-xs font-black text-slate-500">Label</label><input value="${s.label}" oninput="seatingUpdate('label',this.value)" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"></div>
    <div><label class="text-xs font-black text-slate-500">Capacity</label><input type="number" min="1" value="${s.capacity}" oninput="seatingUpdate('capacity',parseInt(this.value)||1)" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"></div>
    <div><label class="text-xs font-black text-slate-500">Price</label><input type="number" min="0" step="0.01" value="${s.price}" oninput="seatingUpdate('price',parseFloat(this.value)||0)" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2"></div>
    <div><label class="text-xs font-black text-slate-500">Type</label><select onchange="seatingUpdate('type',this.value)" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 font-bold"><option value="table" ${s.type==='table'?'selected':''}>Table (sold as one unit)</option><option value="section" ${s.type==='section'?'selected':''}>Section (sold per person)</option></select></div>
    <div><label class="text-xs font-black text-slate-500">Color</label><input type="color" value="${s.color}" oninput="seatingUpdate('color',this.value)" class="mt-1 w-full rounded-xl border border-slate-200 h-10"></div>
    <button type="button" onclick="seatingDelete()" class="rounded-xl bg-rose-50 text-rose-700 px-4 py-2 text-sm font-black">Delete</button>
  </div>`;
}
function seatingAdd(type){
  const layout=seatingLayoutGet();
  const d=SEATING_DEFAULTS[type];
  const n=layout.sections.filter(s=>s.type===type).length+1;
  const total=layout.sections.length;
  const s={id:'seat-'+Date.now()+'-'+Math.floor(Math.random()*1000), label:(type==='table'?'Table '+n:'Section '+n), type, shape:d.shape, x:Math.min(100-d.w,5+((total*13)%65)), y:20+((total*17)%50), w:d.w, h:d.h, capacity:d.capacity, sold:0, price:d.price, color:d.color};
  layout.sections.push(s); seatingLayoutSet(layout);
  seatingSelectedId=s.id;
  seatingRerender();
}
function seatingSelect(id){ seatingSelectedId=id; seatingRerender(); }
function seatingUpdate(field,value){
  const layout=seatingLayoutGet();
  const s=layout.sections.find(x=>x.id===seatingSelectedId); if(!s) return;
  s[field]=value;
  if(field==='type'){ s.shape=SEATING_DEFAULTS[value].shape; }
  seatingLayoutSet(layout);
  seatingRerender();
}
function seatingDelete(){
  const layout=seatingLayoutGet();
  layout.sections=layout.sections.filter(s=>s.id!==seatingSelectedId);
  seatingLayoutSet(layout);
  seatingSelectedId=null;
  seatingRerender();
}
function seatingDragStart(ev,id){
  ev.preventDefault(); ev.stopPropagation();
  const canvas=document.getElementById('seatingCanvas'); if(!canvas) return;
  const rect=canvas.getBoundingClientRect();
  const layout=seatingLayoutGet(); const s=layout.sections.find(x=>x.id===id); if(!s) return;
  seatDrag={id, canvasRect:rect, startXPct:s.x, startYPct:s.y, startClientX:ev.clientX, startClientY:ev.clientY, w:s.w, h:s.h, currentX:s.x, currentY:s.y};
}
function seatingDragMove(ev){
  if(!seatDrag) return;
  const dxPct=(ev.clientX-seatDrag.startClientX)/seatDrag.canvasRect.width*100;
  const dyPct=(ev.clientY-seatDrag.startClientY)/seatDrag.canvasRect.height*100;
  const newX=Math.max(0,Math.min(100-seatDrag.w,seatDrag.startXPct+dxPct));

function fakeId(seed,len){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}
  const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';let out='';let x=h>>>0;

function wellnessSlots(e){

function simpleBarChartSvg(labels,values,colors){
  const w=900,h=190,padL=10,padR=10,padT=10,padB=30;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const n=labels.length||1;
  const groupW=innerW/n;
  const barW=Math.min(60,groupW*0.5);
  const maxV=Math.max(1,...values);
  const y=v=>padT+innerH-(v/maxV*innerH);
  if(!values.some(v=>v>0))return `<div class="text-center text-slate-400 font-bold py-10">No Data</div>`;
  let bars='';
  labels.forEach((l,i)=>{
    const gx=padL+i*groupW+groupW/2;
    const v=values[i]||0;
    const yy=y(v), barH=(padT+innerH)-yy;
    bars+=`<rect x="${gx-barW/2}" y="${yy}" width="${barW}" height="${Math.max(0,barH)}" fill="${colors[i%colors.length]}" rx="4"/>`;
    bars+=`<text x="${gx}" y="${h-10}" font-size="10" fill="#94a3b8" text-anchor="middle">${l}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full" style="height:170px">${bars}</svg>`;
}
function multiLineChartSvg(labels,series){
  const w=900,h=200,padL=34,padR=16,padT=15,padB=30;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const allVals=series.flatMap(s=>s.data);
  const maxV=Math.max(1,...allVals), minV=Math.min(0,...allVals);
  const range=(maxV-minV)||1;
  const n=labels.length;
  const x=i=>padL+(i/((n-1)||1))*innerW;
  const y=v=>padT+innerH-((v-minV)/range*innerH);
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`).join('');
  const xlabels=labels.map((l,i)=>i%3===0?`<text x="${x(i)}" y="${h-6}" font-size="8" fill="#94a3b8" text-anchor="middle">${l}</text>`:'').join('');
  const zeroY=y(0);
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full" style="height:190px">
    <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#e2e8f0"/>
    ${lines}${xlabels}
  </svg>`;
}
function donutChartSvg(labels,values,colors){
  const total=values.reduce((a,v)=>a+v,0);
  if(!total)return `<div class="grid place-items-center" style="height:180px"><div class="h-32 w-32 rounded-full border-[18px] border-slate-100"></div></div><p class="text-center text-slate-400 font-bold text-sm mt-1">No Data</p>`;
  const r=64,cx=90,cy=90,circumference=2*Math.PI*r;
  let offset=0;
  const segs=labels.map((l,i)=>{
    const frac=values[i]/total;
    const dash=frac*circumference;
    const seg=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="24" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=dash;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 180 180" class="mx-auto" style="height:180px">${segs}</svg>
    <div class="flex flex-wrap justify-center gap-3 mt-2">${labels.map((l,i)=>`<span class="flex items-center gap-1.5 text-xs font-bold text-slate-500"><span class="h-2.5 w-2.5 rounded-full inline-block" style="background:${colors[i%colors.length]}"></span>${l}</span>`).join('')}</div>`;
}

function orgExportCookoutAnalytics(){
  const catTest=CAT_DASH['home-cookouts'].test;
  const mineCat=myEventList().filter(e=>catTest(e.category));
  const pool=mineCat.length?mineCat:allEvents().filter(e=>catTest(e.category));
  const rows=[['Event','Food Revenue','Drink Revenue','Manual Add-On Revenue','Plates Collected']];
  pool.forEach(e=>{
    const food=orgFoodFor(e.id).reduce((a,f)=>a+f.actual*f.price,0);
    const addons=orgAddonsFor(e.id).reduce((a,f)=>a+f.actual*f.price,0);
    const inv=DB.get('lk_org_drinks_'+e.id,[])||[];
    const bot=DB.get('lk_org_bottles_'+e.id,[])||[];
    const drink=[...inv,...bot].reduce((a,it)=>a+it.actual*it.price,0);
    const tix=orgTicketSource().filter(t=>t.event===e.title);
    rows.push([e.title,food.toFixed(2),drink.toFixed(2),addons.toFixed(2),tix.filter(t=>t.checkin).length]);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='cookout_analytics.csv';a.click();
  URL.revokeObjectURL(url);
  toast('✅ Cookout analytics exported (CSV)');
}

function orgWellnessFor(id){let d=DB.get('lk_org_wellness_'+id,null);if(!d){d=orgWellnessDefault();DB.set('lk_org_wellness_'+id,d);}return d;}
function orgExportWellnessAnalytics(){
  const catTest=CAT_DASH['home-wellness'].test;
  const mineCat=myEventList().filter(e=>catTest(e.category));
  const pool=mineCat.length?mineCat:allEvents().filter(e=>catTest(e.category));
  const rows=[['Event','Massage Revenue','Nail Revenue','Facial Revenue','Wellness Treatment Revenue','Add-On Revenue','Mobile Revenue','Checked-In']];
  pool.forEach(e=>{
    const svc=orgWellnessFor(e.id);
    const rev=cat=>+svc.filter(s=>s.category===cat).reduce((a,s)=>a+s.actual*s.price,0).toFixed(2);
    const tix=orgTicketSource().filter(t=>t.event===e.title);
    rows.push([e.title,rev('Massage Services'),rev('Nail Services'),rev('Facial Services'),rev('Wellness Treatments'),rev('Service Add-Ons'),rev('Mobile Services'),tix.filter(t=>t.checkin).length]);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='wellness_analytics.csv';a.click();
  URL.revokeObjectURL(url);
  toast('✅ Wellness analytics exported (CSV)');
}

function orgCatStats(catTest){
  const catEvents=allEvents().filter(e=>catTest(e.category));
  const mineCat=myEventList().filter(e=>catTest(e.category));
  const scope=mineCat.length?'mine':'all';
  const pool=scope==='mine'?mineCat:catEvents;
  const titles=pool.map(e=>e.title);
  const tix=orgTicketSource().filter(t=>titles.includes(t.event));
  const gross=tix.reduce((a,t)=>a+t.price,0);
  const commPaid=tix.reduce((a,t)=>a+orgCommissionFor(t),0);
  const fee=+(gross*ORG_PLATFORM_FEE/100).toFixed(2);
  const net=+(gross-fee-commPaid).toFixed(2);
  const checkedIn=tix.filter(t=>t.checkin).length;
  return {tix,gross,commPaid,fee,net,checkedIn,scope,evCount:pool.length,heroImg:pool[0]&&pool[0].image};
}

function orgTicketGenerateSlots(){
  orgTicketSyncDraftFromDom();
  const d=orgTicketDraft;
  if(!d.slotDate){toast('Pick a date first');return;}
  const step=(+d.sessionDuration||60)+(+d.bufferTime||0);
  const [sh,sm]=(d.workdayStart||'09:00').split(':').map(Number);
  const [eh,em]=(d.workdayEnd||'18:00').split(':').map(Number);
  let mins=sh*60+sm; const endMins=eh*60+em;
  const times=[];
  while(mins+step<=endMins){ const h=Math.floor(mins/60), m=mins%60; times.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')); mins+=step; }

function orgTicketBuildPayload(){

  const customProteins=d.customProteins.filter(p=>p.checked&&p.label&&p.label.trim()).map(p=>({label:p.label.trim(),qty:p.qty,mode:p.mode,addonPrice:p.addonPrice}));
  const sides=Object.entries(d.sides).filter(([k,v])=>v.checked).map(([k,v])=>({key:k,label:(ORG_TICKET_SIDES.find(s=>s[0]===k)||[])[1]||k}));
  const customSides=d.customSides.filter(s=>s.checked&&s.label&&s.label.trim()).map(s=>({label:s.label.trim()}));
  const drinks=Object.entries(d.drinks).filter(([k,v])=>v.checked).map(([k,v])=>({key:k,label:(ORG_TICKET_DRINKS.find(x=>x[0]===k)||[])[1]||k,mode:v.mode,price:v.price,qty:v.qty}));
  const manualAddons=d.manualAddons.filter(a=>a.name&&a.name.trim()).map(a=>({name:a.name.trim(),price:a.price,qty:a.qty}));
  const services=Object.entries(d.services).filter(([k,v])=>v.checked).map(([k,v])=>({key:k,label:(ORG_WELLNESS_SERVICES.find(s=>s[0]===k)||[])[1]||k,mode:v.mode,price:v.price}));
  const customServices=d.customServices.filter(s=>s.checked&&s.label&&s.label.trim()).map(s=>({label:s.label.trim(),mode:s.mode,price:s.price}));
  const wellnessAddons=d.wellnessAddons.filter(a=>a.name&&a.name.trim()).map(a=>({name:a.name.trim(),price:a.price,qty:a.qty}));
  return {
    category:d.category, ticketType:d.ticketType, name:(d.name||'').trim()||'Ticket', description:d.description||'',
    isFree:d.isFree, price:d.isFree?0:(+d.price||0), promoPrice:+d.promoPrice||0, qty:parseInt(d.qty)||0, perAttendee:parseInt(d.perAttendee)||0,
    saleStart:d.saleStart||'', saleEnd:d.saleEnd||'', status:d.status||'Active',
    commMode:d.commMode||'pct', commission:d.commMode==='pct'?(+d.commission||0):0, commFlat:d.commMode==='flat'?(+d.commFlat||0):0,
    cuisinePreset:d.cuisinePreset||'',
    proteins, customProteins, sides, customSides, drinks, manualAddons,
    includesTable:d.includesTable, tablePrice:d.includesTable?(+d.tablePrice||0):0, tableSeats:d.includesTable?(parseInt(d.tableSeats)||0):0,
    tableDrinkPackage:d.includesTable?d.tableDrinkPackage:'', tableSeatingSections:d.includesTable?d.tableSeatingSections.filter(s=>s&&s.trim()):[],
    includeDrinkAddons:d.includeDrinkAddons, drinkAddons:d.includeDrinkAddons?d.drinkAddons:orgTicketEmptyDrinkAddons(),
    servicePreset:d.servicePreset||'', sessionDuration:parseInt(d.sessionDuration)||60, bufferTime:parseInt(d.bufferTime)||0,
    maxBookingsPerSlot:parseInt(d.maxBookingsPerSlot)||1, serviceMode:d.serviceMode||'In-Studio', mobileFee:d.serviceMode==='Mobile'?(+d.mobileFee||0):0,
    refundPolicy:d.refundPolicy||'', slotDate:d.slotDate||'', workdayStart:d.workdayStart||'09:00', workdayEnd:d.workdayEnd||'18:00',
    slots:d.slots, services, customServices, wellnessAddons
  };
}

function orgDuplicateEvent(id){
  const list=DB.get('lk_events',[]);
  const ev=list.find(e=>String(e.id)===String(id));
  if(!ev){toast('Publish your own event to duplicate it');return;}
  const copy=Object.assign({},ev,{id:'e'+Date.now(),title:ev.title+' (Copy)',status:'draft',createdAt:Date.now(),updatedAt:Date.now()});
  list.unshift(copy);DB.set('lk_events',list);
  orgDetailEventId=copy.id;showOrgPortal();
  toast('✅ Event duplicated as draft');

function drinksChartCard(items){

function drinksChartSvg(items){
  if(!items.length)return `<div class="text-center text-slate-400 font-bold py-10">No items to chart.</div>`;
  const w=900,h=240,padL=44,padR=44,padT=10,padB=34;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const n=items.length, groupW=innerW/n;
  const barW=Math.max(4,Math.min(14,groupW/6));
  const unitsMax=Math.max(1,...items.map(it=>Math.max(it.forecast,it.actual)));
  const revData=items.map(it=>{const g=it.actual*it.price;const fee=+(g*DRINK_FEE_PCT).toFixed(2);return {fee,net:+(g-fee).toFixed(2)};});
  const revMax=Math.max(1,...revData.map(r=>Math.max(r.fee,r.net)));
  const yU=v=>padT+innerH-(v/unitsMax*innerH);
  const yR=v=>padT+innerH-(v/revMax*innerH);
  let bars='';
  items.forEach((it,i)=>{
    const gx=padL+i*groupW+groupW/2;
    const r=revData[i];
    const series=[[it.forecast,yU(it.forecast),'#3b82f6'],[it.actual,yU(it.actual),'#84cc16'],[r.fee,yR(r.fee),'#f97316'],[r.net,yR(r.net),'#16a34a']];
    series.forEach((s,si)=>{
      const x=gx-2*barW+si*barW, y=s[1], barH=(padT+innerH)-y;
      bars+=`<rect x="${x}" y="${y}" width="${barW-1.5}" height="${Math.max(0,barH)}" fill="${s[2]}" rx="1.5"/>`;
    });
    bars+=`<text x="${gx}" y="${h-10}" font-size="9" fill="#94a3b8" text-anchor="middle">${(it.name||'').slice(0,9)}</text>`;
  });
  const ticks=[0,0.5,1].map(f=>{
    const yu=padT+innerH-(f*innerH);
    return `<line x1="${padL}" y1="${yu}" x2="${w-padR}" y2="${yu}" stroke="#f1f5f9"/>
      <text x="${padL-6}" y="${yu+3}" font-size="9" fill="#cbd5e1" text-anchor="end">${Math.round(f*unitsMax)}</text>
      <text x="${w-padR+6}" y="${yu+3}" font-size="9" fill="#cbd5e1" text-anchor="start">${Math.round(f*revMax)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full" style="height:220px">
    ${ticks}${bars}
    <text x="12" y="${padT+innerH/2}" font-size="10" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 12 ${padT+innerH/2})">Units</text>
    <text x="${w-10}" y="${padT+innerH/2}" font-size="10" fill="#94a3b8" text-anchor="middle" transform="rotate(90 ${w-10} ${padT+innerH/2})">Revenue ($)</text>
  </svg>`;
}

const PAYOUT_FLAT_FEE=3;

function orgEventNetAvailable(ev){
  // Standard LinkUp platform fee (ORG_PLATFORM_FEE, 5%) applies to gross ticket revenue across
  // every source, POS included — it is not excluded just because a ticket was sold at the door.
  // On top of that, POS sales carry their own separate Point of Sale fee (platform % + processing
  // $, shown as a reference line at the register), tracked in the POS fee ledger and subtracted
  // here via posFeeOwed — the two fees are independent and both come out of the payout.
  const tix=orgTicketSource().filter(t=>t.event===ev.title);
  const gross=tix.reduce((a,t)=>a+t.price,0);
  const commPaid=tix.reduce((a,t)=>a+orgCommissionFor(t),0);
  const fee=+(gross*ORG_PLATFORM_FEE/100).toFixed(2);
  const posFeeOwed=orgPosOutstandingForEvent(ev.title);
  return Math.max(0,+(gross-fee-commPaid-posFeeOwed).toFixed(2));
}

function orgPayoutSubmit(){

function orgExportAttendees(){

function bcRecalc(evId){
  const ev=orgFindEvent(evId);if(!ev)return;
  const scope=($('bcAudience')||{}).value||'all';
  let tix=orgTicketSource().filter(t=>t.event===ev.title);
  if(scope==='checked_in')tix=tix.filter(t=>t.checkin);
  else if(scope==='confirmed')tix=tix.filter(t=>!t.checkin);
  $('bcRecipients').textContent=tix.length;

function bcApplyPreset(v){

function bcSend(){

}

const ORG_POS_DEFAULT_PLATFORM_PCT=7.7;
const ORG_POS_DEFAULT_FIXED_FEE=0.30;
const ORG_POS_TAX_PCT=10;
let orgPosCart=[];
let orgPosBuyer={name:'',email:''};
let orgPosCharges={tax:false};
let orgPosMethod='Cash';
function orgPosSetBuyer(key,val){orgPosBuyer[key]=val;}
function orgPosSetMethod(v){orgPosMethod=v;orgPosRecalc();}
function orgPosFeeConfig(){
  const all=DB.get('lk_admin_pos_fee_config',{});
  const country=orgProfile().country||'';
  const cfg=all[country]||all.default||{};
  return {
    platformPct: typeof cfg.platformPct==='number'?cfg.platformPct:ORG_POS_DEFAULT_PLATFORM_PCT,
    fixedFee: typeof cfg.fixedFee==='number'?cfg.fixedFee:ORG_POS_DEFAULT_FIXED_FEE
  };
}
function orgPosCalcCharges(subtotal,method){
  const cfg=orgPosFeeConfig();
  const platformFee=+(subtotal*cfg.platformPct/100).toFixed(2);
  const processingFee=method==='Credit'?+cfg.fixedFee.toFixed(2):0;
  const totalFee=+(platformFee+processingFee).toFixed(2);
  const tax=orgPosCharges.tax?+(subtotal*ORG_POS_TAX_PCT/100).toFixed(2):0;
  // The fee is embedded in what the buyer pays (a reference line, not a silent deduction) —
  // the organizer collects the full total either way; LinkUp settles the fee later at payout.
  const buyerTotal=+(subtotal+totalFee+tax).toFixed(2);
  const net=+(subtotal+tax).toFixed(2);
  return {cfg,platformFee,processingFee,totalFee,tax,buyerTotal,net};
}
function orgPosRecalc(){
  const taxChk=$('posTaxChk');
  orgPosCharges.tax=!!(taxChk&&taxChk.checked);
  const subtotal=orgPosCart.reduce((a,i)=>a+i.price*i.qty,0);
  const {platformFee,processingFee,tax,buyerTotal}=orgPosCalcCharges(subtotal,orgPosMethod);
  if($('posFeeAmt'))$('posFeeAmt').textContent=money(platformFee);
  if($('posProcRow'))$('posProcRow').style.display=orgPosMethod==='Credit'?'flex':'none';
  if($('posProcAmt'))$('posProcAmt').textContent=money(processingFee);
  if($('posTaxAmt'))$('posTaxAmt').textContent=money(tax);
  if($('posGrandTotal'))$('posGrandTotal').textContent=money(buyerTotal);
}
function orgPosAddToCart(title,price){
  const existing=orgPosCart.find(i=>i.title===title);
  if(existing)existing.qty++;
  else orgPosCart.push({title,price,qty:1});

}
function orgPosChangeQty(title,delta){
  const item=orgPosCart.find(i=>i.title===title);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0)orgPosCart=orgPosCart.filter(i=>i.title!==title);
  showOrgPortal();
}
function orgPosClearCart(){orgPosCart=[];orgPosBuyer={name:'',email:''};orgPosCharges={tax:false};orgPosMethod='Cash';showOrgPortal();}

  return `${orgSectionHeader('credit-card','Point of Sale','Sell tickets at the door','linear-gradient(120deg,#059669,#14b8a6)')}
    <div class="flex items-center justify-end mb-4 flex-wrap gap-2">

          <option ${orgPosMethod==='Cash'?'selected':''}>Cash</option>
          <option ${orgPosMethod==='Credit'?'selected':''}>Credit</option>
        </select>
        <button onclick="orgPosCharge()" class="btn btn-primary w-full py-3 mt-2" ${orgPosCart.length?'':'disabled'}>Charge &amp; Issue Ticket${totalQty>1?'s':''}</button>

function orgPosCharge(){
  if(!orgPosCart.length){toast('Cart is empty');return;}
  const method=orgPosMethod||'Cash';
  const buyer=(orgPosBuyer.name||'').trim()||'Walk-in Customer';
  const email=(orgPosBuyer.email||'').trim();
  const subtotal=orgPosCart.reduce((a,i)=>a+i.price*i.qty,0);
  const {platformFee,processingFee,tax,buyerTotal}=orgPosCalcCharges(subtotal,method);
  const orders=DB.get('lk_ticket_orders',[]);
  const time=new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  const txns=DB.get('lk_org_pos_transactions',[]);
  const ledger=DB.get('lk_org_fee_ledger',[]);
  const orderId='POS-'+Date.now().toString().slice(-6);
  const receiptLines=[];
  orgPosCart.forEach(i=>{
    for(let n=0;n<i.qty;n++){orders.push({id:Date.now()+Math.floor(Math.random()*100000),title:i.title,price:i.price,source:'pos',buyer,email:email||null,method,created_at:new Date().toISOString()});}
    const lineSubtotal=+(i.price*i.qty).toFixed(2);
    receiptLines.push({title:i.title,qty:i.qty,price:i.price,lineTotal:lineSubtotal});
    txns.unshift({orderId,event:i.title,qty:i.qty,amount:lineSubtotal,method,time,buyer,email,platformFee,processingFee,tax});
    const share=subtotal>0?lineSubtotal/subtotal:0;
    const linePlatformFee=+(platformFee*share).toFixed(2);
    const lineProcessingFee=+(processingFee*share).toFixed(2);
    ledger.push({
      id:'FL-'+Date.now()+'-'+Math.floor(Math.random()*100000),
      orderId, event:i.title, ts:Date.now(), date:new Date().toISOString(),
      amount:lineSubtotal, method, buyer, email:email||null,
      platformFee:linePlatformFee, processingFee:lineProcessingFee,
      totalFee:+(linePlatformFee+lineProcessingFee).toFixed(2),
      net:+(lineSubtotal-linePlatformFee-lineProcessingFee).toFixed(2),
      status:'outstanding', deductedInPayout:null,
      country:orgProfile().country||''
    });
  });
  DB.set('lk_ticket_orders',orders);
  DB.set('lk_org_pos_transactions',txns);
  DB.set('lk_org_fee_ledger',ledger);
  DB.set('lk_org_pos_today',+(DB.get('lk_org_pos_today',0)+buyerTotal).toFixed(2));
  orgPosCart=[];
  orgPosBuyer={name:'',email:''};
  orgPosCharges={tax:false};
  orgPosMethod='Cash';
  orgPosShowReceipt(orderId,receiptLines,subtotal,platformFee,processingFee,tax,buyerTotal,method,time,buyer,email);
}
function orgGroupedReceipts(limit){
  const txns=DB.get('lk_org_pos_transactions',[]);
  const groups={};
  const order=[];
  txns.forEach(t=>{
    const oid=t.orderId||('legacy-'+t.time+'-'+t.event);
    if(!groups[oid]){groups[oid]={orderId:oid,time:t.time,method:t.method,buyer:t.buyer||'Walk-in Customer',email:t.email||'',platformFee:t.platformFee||0,processingFee:t.processingFee||0,tax:t.tax||0,lines:[],subtotal:0};order.push(oid);}
    groups[oid].lines.push(t);
    groups[oid].subtotal=+(groups[oid].subtotal+t.amount).toFixed(2);
  });
  const list=order.map(id=>groups[id]);
  list.forEach(g=>{
    g.totalFee=+(g.platformFee+g.processingFee).toFixed(2);
    g.buyerTotal=+(g.subtotal+g.totalFee+g.tax).toFixed(2);
    g.net=+(g.subtotal+g.tax).toFixed(2);
  });
  return list.slice(0,limit||9999);
}

/* ---- POS fee ledger: outstanding balance, audit trail ---- */
function orgPosFeeLedger(){return DB.get('lk_org_fee_ledger',[]);}
function orgPosOutstandingForEvent(eventTitle){
  return +orgPosFeeLedger().filter(f=>f.event===eventTitle&&f.status==='outstanding').reduce((a,f)=>a+f.totalFee,0).toFixed(2);
}
function orgPosOutstandingTotal(){
  return +orgPosFeeLedger().filter(f=>f.status==='outstanding').reduce((a,f)=>a+f.totalFee,0).toFixed(2);
}
function orgPosFeesEarnedTotal(){
  return +orgPosFeeLedger().reduce((a,f)=>a+f.totalFee,0).toFixed(2);
}
function orgPosCollectedTotal(){
  return +orgPosFeeLedger().filter(f=>f.status==='settled').reduce((a,f)=>a+f.totalFee,0).toFixed(2);
}
function orgFeeAuditLog(){return DB.get('lk_org_fee_audit_log',[]);}
function orgDeductOutstandingForEvent(eventTitle,payoutRef){
  const ledger=orgPosFeeLedger();
  const entries=ledger.filter(f=>f.event===eventTitle&&f.status==='outstanding');
  if(!entries.length)return 0;
  let deducted=0;
  entries.forEach(f=>{f.status='settled';f.deductedInPayout=payoutRef;deducted+=f.totalFee;});
  DB.set('lk_org_fee_ledger',ledger);
  deducted=+deducted.toFixed(2);
  if(deducted>0){
    const log=DB.get('lk_org_fee_audit_log',[]);
    log.unshift({id:'AL-'+Date.now(),ts:Date.now(),date:new Date().toLocaleString(),payoutRef,event:eventTitle,amountDeducted:deducted,entryIds:entries.map(e=>e.id)});
    DB.set('lk_org_fee_audit_log',log);
  }
  return deducted;
}

function orgExportPosTransactionsCSV(){

function orgExportAllReports(){
  const rows=[['Event','Date','Status','Tickets Sold','Revenue','Checked In']];
  allEvents().forEach(ev=>{
    const tix=orgTicketSource().filter(t=>t.event===ev.title);
    rows.push([ev.title,ev.date,orgEventStatus(ev),tix.length,tix.reduce((a,t)=>a+t.price,0).toFixed(2),tix.filter(t=>t.checkin).length]);
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='event_statistics_report.csv';a.click();
  URL.revokeObjectURL(url);
  toast('✅ Report exported (CSV)');
}

/* --- Reusable image adjuster: drag to reposition, slider to zoom, before a photo is actually used anywhere --- */
let iaState=null;
function openImageAdjust(file,aspect,onSave){
  const url=URL.createObjectURL(file);

  img.onload=()=>{ iaState={img,url,aspect,onSave,scale:0,offX:0,offY:0,dragging:false,startX:0,startY:0,startOffX:0,startOffY:0}; renderImageAdjust(); };

function closeImageAdjust(){

function renderImageAdjust(){
  const s=iaState; if(!s)return;

  s.minScale=Math.max(s.vpW/s.img.naturalWidth, s.vpH/s.img.naturalHeight);
  if(!s.scale||s.scale<s.minScale)s.scale=s.minScale;

  $('modalCard').className='card w-full max-w-md max-h-[90vh] overflow-y-auto fade';
  openModal(`<div class="p-5">
    <div class="flex items-center justify-between mb-1"><h3 class="text-xl font-black">Adjust Photo</h3><button onclick="closeImageAdjust()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <p class="text-slate-500 text-sm mb-4">Drag to reposition · use the slider to zoom.</p>
    <div id="iaViewport" class="relative mx-auto overflow-hidden rounded-2xl bg-slate-900 select-none" style="width:${s.vpW}px;height:${s.vpH}px;cursor:grab" onmousedown="iaDragStart(event)" ontouchstart="iaDragStart(event)">
      <img id="iaImg" src="${s.url}" draggable="false" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(${s.offX}px,${s.offY}px) scale(${s.scale});transform-origin:center;user-select:none;pointer-events:none"/>
    </div>
    <div class="flex items-center gap-3 mt-4">
      <i data-lucide="zoom-out" class="w-4 h-4 text-slate-400 shrink-0"></i>
      <input type="range" id="iaZoom" min="${s.minScale}" max="${s.minScale*3}" step="0.001" value="${s.scale}" oninput="iaSetZoom(this.value)" class="flex-1"/>
      <i data-lucide="zoom-in" class="w-4 h-4 text-slate-400 shrink-0"></i>
    </div>
    <div class="flex gap-3 mt-5"><button onclick="closeImageAdjust()" class="btn btn-ghost flex-1 py-3">Cancel</button><button onclick="iaSave()" class="btn btn-primary flex-1 py-3">Save</button></div>
  </div>`);

function iaPoint(e){const t=e.touches&&e.touches[0]?e.touches[0]:e; return {x:t.clientX,y:t.clientY};}
function iaDragStart(e){if(!iaState)return; const p=iaPoint(e); iaState.dragging=true; iaState.startX=p.x; iaState.startY=p.y; iaState.startOffX=iaState.offX; iaState.startOffY=iaState.offY; const vp=$('iaViewport'); if(vp)vp.style.cursor='grabbing';
  document.addEventListener('mousemove',iaDragMove); document.addEventListener('mouseup',iaDragEnd);
  document.addEventListener('touchmove',iaDragMove,{passive:false}); document.addEventListener('touchend',iaDragEnd);

function iaClamp(){const s=iaState; const dispW=s.img.naturalWidth*s.scale, dispH=s.img.naturalHeight*s.scale;
  const maxX=Math.max(0,(dispW-s.vpW)/2), maxY=Math.max(0,(dispH-s.vpH)/2);

function iaApplyTransform(){const el=$('iaImg'); if(el&&iaState)el.style.transform=`translate(-50%,-50%) translate(${iaState.offX}px,${iaState.offY}px) scale(${iaState.scale})`;}

  ctx.drawImage(s.img,dx,dy,imgDispW,imgDispH);
  const dataUrl=canvas.toDataURL('image/jpeg',0.92);
  const cb=s.onSave; closeImageAdjust(); cb(dataUrl);
}

/* ---------- MARKETPLACE DELIVERY: LinkUp Driver pricing, service tiers & driver choice ----------
   Ported from the Consumer App (phone) so both surfaces behave identically. Reads the SAME
   lk_delivery_pricing admin config as the phone app and the Admin Dashboard — a rate change made
   in the Admin Dashboard applies here too, no code change needed. */
const COUNTRY_COORDS={
  'Bahamas':[25.0343,-77.3963],'Jamaica':[18.1096,-77.2975],'Trinidad & Tobago':[10.6918,-61.2225],
  'Anguilla':[18.2206,-63.0686],'Barbados':[13.1939,-59.5432],'St. Lucia':[13.9094,-60.9789],
  'Colombia':[4.5709,-74.2973],'Dominican Republic':[18.7357,-70.1627],'Mexico':[23.6345,-102.5528],'Brazil':[-14.2350,-51.9253]
};
function haversineKm(a,b,c,d){const R=6371,p=Math.PI/180;const dLat=(c-a)*p,dLng=(d-b)*p;const x=Math.sin(dLat/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLng/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)));}
function geoJitter([lat,lng]){return [lat+(Math.random()-0.5)*0.3, lng+(Math.random()-0.5)*0.3];}
function sellerCountryOf(p){
  for(const c of Object.keys(COUNTRY_COORDS)) if(p.seller && p.seller.includes(c)) return c;
  if(/Nassau|,\s*BS$/.test(p.seller||'')) return 'Bahamas';
  if(/Kingston|,\s*JM$/.test(p.seller||'')) return 'Jamaica';
  if(/\bTT\b|Trinidad/.test(p.seller||'')) return 'Trinidad & Tobago';
  if(/The Valley|,\s*AI$/.test(p.seller||'')) return 'Anguilla';
  return USER.country;
}

const DELIVERY_CLASSES_DEFAULT={
  standard:{label:'Standard',icon:'🛵',vehicle:'Bike/Car',base:3.50,perKm:0.60,driverShare:0.72,maxKm:50,desc:'Fits in a bag or trunk (up to ~20 lb).'},
  large:{label:'Large',icon:'🚙',vehicle:'SUV/Pickup',base:7.00,perKm:0.95,driverShare:0.75,maxKm:50,desc:'Bigger boxes, one-person lift (20–75 lb).'},
  oversized:{label:'Oversized',icon:'🚛',vehicle:'Truck (XL)',base:22.00,perKm:1.85,driverShare:0.78,crew2:true,crewFee:8,maxKm:80,desc:'Furniture, appliances — truck + 2-person crew (75+ lb or bulky).'}
};
function mktDeliveryClass(p){
  const tier=(p&&p.deliveryClass)||'standard';
  const d=DELIVERY_CLASSES_DEFAULT[tier]||DELIVERY_CLASSES_DEFAULT.standard;
  let admin=null; try{admin=(JSON.parse(localStorage.getItem('lk_delivery_pricing')||'{}'))[tier]||null;}catch(e){}
  if(!admin) return d;
  return Object.assign({},d,{
    base:admin.base!=null?admin.base:d.base,
    perKm:admin.perKm!=null?admin.perKm:d.perKm,
    maxKm:admin.maxKm!=null?admin.maxKm:d.maxKm,
    driverShare:admin.share!=null?admin.share/100:d.driverShare,
    crewFee:admin.crewFee!=null?admin.crewFee:d.crewFee
  });
}
const MKT_SERVICE_TIERS={
  standard:{label:'Standard',etaMultiplier:1,priceMultiplier:1},
  priority:{label:'Priority',etaMultiplier:0.55,priceMultiplier:1.45}
};
let mktServiceTier='standard';
function mktDeliveryFee(p,km,tierKey){
  const c=mktDeliveryClass(p);const boundedKm=Math.min(km||3,c.maxKm);let fee=c.base+c.perKm*boundedKm;if(c.crew2)fee+=c.crewFee;
  const tier=MKT_SERVICE_TIERS[tierKey||mktServiceTier]||MKT_SERVICE_TIERS.standard;
  fee*=tier.priceMultiplier;
  return Math.round(fee*100)/100;
}
function mktDriverPayout(p,fee){return Math.round(fee*mktDeliveryClass(p).driverShare*100)/100;}
function mktDeliveryInRange(p,km){return km<=mktDeliveryClass(p).maxKm;}

const MKT_DRIVER_POOL=['Devon Rolle','Marlon Grant','Keisha Bain','Andre Miller','Tanya Cooper','Renaldo Smith','Aisha Ferguson','Cody Knowles','Shanice Adderley','Leon Farrington'];
let mktDriverSets=null,mktDriverSetKey=null,mktSelectedDriverId=null;
function mktGenDriverSets(p,km){
  const key=p.id+'|'+Math.round(km);
  if(mktDriverSets&&mktDriverSetKey===key)return mktDriverSets;
  const dcls=mktDeliveryClass(p);
  const baseEta=Math.max(4,Math.round(km*1.6));
  const pool=MKT_DRIVER_POOL.slice().sort(()=>Math.random()-0.5).slice(0,3);
  const base=pool.map((name,i)=>({id:'d'+i,name,initials:name.split(' ').map(w=>w[0]).join('').slice(0,2),vehicle:dcls.vehicle,plate:Math.floor(1000+Math.random()*8999),rating:(4.6+Math.random()*0.35).toFixed(1),rank:i}));
  const sets={};
  Object.keys(MKT_SERVICE_TIERS).forEach(t=>{
    const mult=MKT_SERVICE_TIERS[t].etaMultiplier;
    sets[t]=base.map(d=>Object.assign({},d,{etaMin:Math.max(3,Math.round((baseEta+d.rank*3)*mult))})).sort((a,b)=>a.etaMin-b.etaMin);
  });
  mktDriverSets=sets;mktDriverSetKey=key;
  return sets;
}
function mktGenDrivers(p,km){
  const sets=mktGenDriverSets(p,km);

  if(mktSelectedDriverId&&!list.some(d=>d.id===mktSelectedDriverId))mktSelectedDriverId=null;

}

function apSyncSeller(){/* keeps type/seller loosely in sync; no-op for demo */}
function saveProduct(){const n=($('apName')||{}).value;if(!n){toast('Enter a product name');return;}
  const type=($('apType')||{}).value||'Individual';const seller=($('apSeller')||{}).value||'Individual Seller';
  const stores=DB.get('lk_stores',[]),groups=DB.get('lk_groups',[]);
  const owner=type==='Store'?stores.find(s=>s.name===seller):type==='Group'?groups.find(g=>g.name===seller):null;
  const myUni=DB.get('lk_my_uni',null);
  const prod={id:'u'+Date.now(), seller_type:type, seller:(owner?(owner.name+' · '+(owner.city||USER.city)):(seller+' · '+USER.city)), title:n, price:parseFloat(($('apPrice')||{}).value)||0, category:($('apCat')||{}).value||'Other', stock:parseInt(($('apStock')||{}).value)||1, fulfil:(owner&&owner.pickups&&owner.pickups.length)?'Pickup available':'Delivery only', image:(($('apUrl')||{}).value||'')||PIC('u'+Date.now(),700,500), desc:($('apDesc')||{}).value||'', commission:Math.max(0,Math.min(50,parseInt(($('apComm')||{}).value)||10)), listed:true, campus:myUni?myUni.key:null};
  const list=DB.get('lk_products',[]);list.unshift(prod);DB.set('lk_products',list);
  closeModal();mktCat=(prod.category==='Carnival')?'Carnival':'All';current='marketplace';render();toast('✅ "'+n+'" published to Marketplace');
}
/* ============ AFFILIATE: promote ANY seller's product, earn commission on sales you drive ============ */
const PLATFORM_FEE=5; // % LinkUp keeps on affiliate sales
function affPromos(){return DB.get('lk_affiliate_promos',[]);}
function isPromoting(id){return affPromos().some(p=>String(p.id)===String(id));}
function affEarnings(){return DB.get('lk_affiliate_earnings',{pending:0,available:0,paid:0,clicks:0,sales:[]});}
function promoteTag(kind,id){const src=kind==='event'?allEvents().find(x=>String(x.id)===String(id)):allProducts().find(x=>String(x.id)===String(id));if(!src)return;
  const t=kind==='event'?eventTag(src):productTag(src);
  const list=affPromos();if(list.some(x=>String(x.id)===String(id)&&x.kind===t.kind)){toast('Already promoting');return;}
  list.unshift(t);DB.set('lk_affiliate_promos',list);toast('🤝 Promoting '+t.title+' — earn '+tagCommShort(t));renderAffiliate();}
function promoteProduct(id){promoteTag('product',id);}
function unpromote(id){DB.set('lk_affiliate_promos',affPromos().filter(x=>String(x.id)!==String(id)));renderAffiliate();}
// called when a product sells through THIS creator's live/vibe (they're the affiliate)
function recordAffiliateSale(p,source){const comm=tagCommAmt(p);if(comm<=0)return 0;const e=affEarnings();e.pending=+(e.pending+comm).toFixed(2);e.sales.unshift({title:p.title,amount:p.price,commission:comm,rate:tagCommShort(p),status:'pending',source:source||'live'});if(e.sales.length>50)e.sales.length=50;DB.set('lk_affiliate_earnings',e);return comm;}
let affTab='browse';
function openAffiliateHub(tab){affTab=tab||'browse';renderAffiliate(true);}
let affSourceFilter='all';
function setAffSourceFilter(s){affSourceFilter=s;renderAffiliate();}
function affSourceLabel(src){return src==='uvibe'?'🎓 from U Vibe':src==='vibe'?'✨ from Vibes':'📡 from Live';}
function renderAffiliate(reopen){
  const e=affEarnings(), promos=affPromos();
  const tabs=[['browse','Promote'],['promos','My Promotions'],['earnings','Earnings']];
  let body='';
  if(affTab==='browse'){
    const prods=allProducts().filter(p=>(p.stock==null||p.stock>0)).map(productTag).filter(t=>tagCommAmt(t)>0);
    const evs=allEvents().map(eventTag).filter(t=>tagCommAmt(t)>0);
    const list=prods.concat(evs);
    body=`<p class="text-[12px] text-slate-500 mb-2">Tag any of these on your Live or Vibes — you earn what the seller/organizer is offering, on every sale you drive. No inventory, no risk.</p>
      <div class="space-y-2">${list.map(t=>{const promoting=isPromoting(t.id);const ev=t.kind==='event';return `<div class="flex items-center gap-3 rounded-2xl border border-slate-100 p-2">
        <div class="relative shrink-0"><img src="${t.image}" class="h-14 w-14 rounded-xl object-cover"/><span class="absolute -top-1 -left-1 text-white text-[9px] font-black px-1 py-0.5 rounded-full" style="background:${ev?'#2563eb':'#8b5cf6'}">${ev?'🎟️':'🛍️'}</span></div>
        <div class="flex-1 min-w-0"><p class="font-black text-sm truncate">${t.title}</p><p class="text-[11px] text-slate-500 truncate">${ev?`${fmtDate(t.date)} · ${t.location}`:t.seller} · ${t.price?money(t.price):'Free'}</p><p class="text-[11px] font-black text-emerald-600 mt-0.5">${tagCommLabel(t)}</p></div>
        <button onclick="${promoting?`unpromote('${t.id}')`:`promoteTag('${t.kind}','${t.id}')`}" class="btn ${promoting?'btn-ghost':'btn-primary'} px-3 py-2 text-xs shrink-0">${promoting?'Promoting ✓':'Promote'}</button></div>`;}).join('')}</div>`;
  } else if(affTab==='promos'){
    body=promos.length?`<div class="space-y-2">${promos.map(p=>`<div class="flex items-center gap-3 rounded-2xl border border-slate-100 p-2">
      <img src="${p.image}" class="h-14 w-14 rounded-xl object-cover"/>
      <div class="flex-1 min-w-0"><p class="font-black text-sm truncate">${p.kind==='event'?'🎟️ ':''}${p.title}</p><p class="text-[11px] text-emerald-600 font-black">${tagCommLabel(p)}</p></div>
      <div class="flex flex-col gap-1.5 shrink-0"><button onclick="affTagLive('${p.kind||'product'}','${p.id}')" class="btn btn-primary px-3 py-2 text-xs">Tag on Live</button><button onclick="unpromote('${p.id}')" class="btn btn-ghost px-3 py-2 text-xs text-rose-600">Remove</button></div></div>`).join('')}</div>`
      :'<div class="card p-8 text-center text-slate-400 font-bold">No promotions yet — go to Promote and pick products to earn on.</div>';
  } else {
    const total=+(e.pending+e.available+e.paid).toFixed(2);
    body=`<div class="grid grid-cols-3 gap-2">
        <div class="card p-3 text-center"><p class="text-xl font-black">${e.sales.length}</p><p class="text-[11px] text-slate-400">Sales driven</p></div>
        <div class="card p-3 text-center"><p class="text-xl font-black text-emerald-600">${money(total)}</p><p class="text-[11px] text-slate-400">Commission</p></div>
        <div class="card p-3 text-center"><p class="text-xl font-black">${e.clicks||0}</p><p class="text-[11px] text-slate-400">Taps</p></div></div>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <div class="rounded-2xl bg-amber-50 border border-amber-200 p-3"><p class="text-[11px] font-black text-amber-700">Pending (escrow)</p><p class="text-2xl font-black text-amber-700">${money(e.pending)}</p><p class="text-[10px] text-amber-600">Released when buyers receive orders</p></div>
        <div class="rounded-2xl bg-emerald-50 border border-emerald-200 p-3"><p class="text-[11px] font-black text-emerald-700">Available</p><p class="text-2xl font-black text-emerald-700">${money(e.available)}</p></div></div>
      <div class="flex gap-2 mt-2">${e.pending>0?`<button onclick="affRelease()" class="btn btn-ghost flex-1 py-3">Simulate deliveries → release</button>`:''}<button onclick="affTransfer()" class="btn btn-primary flex-1 py-3">Transfer ${money(e.available)} to Wallet</button></div>
      <p class="text-[11px] text-slate-400 text-center mt-1">LinkUp keeps ${PLATFORM_FEE}% · seller is paid separately via escrow · already paid out ${money(e.paid)}</p>
      <div class="flex items-center justify-between mt-3 mb-1"><p class="font-black">Recent commissions</p>
        <div class="flex gap-1.5">${[['all','All'],['vibe','Vibes'],['uvibe','U Vibe'],['live','Live']].map(([k,lbl])=>`<button onclick="setAffSourceFilter('${k}')" class="rounded-full px-2.5 py-1 text-[11px] font-black ${affSourceFilter===k?'bg-lkblue text-white':'bg-slate-100 text-slate-500'}">${lbl}</button>`).join('')}</div></div>
      <div class="space-y-1.5 max-h-40 overflow-y-auto">${(()=>{const filtered=affSourceFilter==='all'?e.sales:e.sales.filter(s=>s.source===affSourceFilter);return filtered.length?filtered.map(s=>`<div class="flex items-center justify-between border border-slate-100 rounded-xl p-2 text-sm"><div class="min-w-0"><p class="font-bold truncate">${s.title}</p><p class="text-[11px] text-slate-400">${money(s.amount)} · ${s.rate}% · <span class="font-bold ${s.source==='uvibe'?'text-violet-500':s.source==='vibe'?'text-purple-500':'text-rose-500'}">${affSourceLabel(s.source)}</span></p></div><span class="font-black text-emerald-600 shrink-0">+${money(s.commission)} <span class="text-[10px] ${s.status==='paid'?'text-emerald-500':'text-amber-500'}">${s.status}</span></span></div>`).join(''):'<p class="text-center text-slate-400 text-sm py-4">No commissions yet — tag a product or event on Vibes, U Vibe, or a Live stream and make a sale.</p>';})()}</div>`;
  }
  const html=`<div class="brandgrad text-white p-4"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="h-9 w-9 rounded-xl grid place-items-center bg-white/20"><i data-lucide="handshake" class="w-5 h-5"></i></span><div><h3 class="text-lg font-black">Promote & Earn</h3><p class="text-white/85 text-[11px]">Sell for any store — earn on every sale you drive</p></div></div><button onclick="closeModal()" class="bg-white/20 rounded-full px-3 py-1.5 text-xs font-black">✕</button></div>
    <div class="flex gap-2 mt-3">${tabs.map(t=>`<button onclick="affTab='${t[0]}';renderAffiliate()" class="shrink-0 rounded-full px-4 py-1.5 text-sm font-black ${affTab===t[0]?'bg-white text-lkblue2':'bg-white/20 text-white'}">${t[1]}</button>`).join('')}</div></div>
    <div class="p-4">${body}</div>`;
  if(reopen||!document.getElementById('modal').classList.contains('open'))openModal(html); else {$('modalCard').innerHTML=html;if(window.lucide)lucide.createIcons();}
}
function affTagLive(kind,id){const t=affPromos().find(x=>String(x.id)===String(id)&&(x.kind||'product')===kind);if(!t)return;bcForm.products=[Object.assign({},t)];closeModal();openGoLive();toast('🔴 '+(t.kind==='event'?'Event':'Product')+' loaded — go live to start selling');}
function affRelease(){const e=affEarnings();if(e.pending<=0)return;e.available=+(e.available+e.pending).toFixed(2);e.sales.forEach(s=>{if(s.status==='pending')s.status='released';});e.pending=0;DB.set('lk_affiliate_earnings',e);renderAffiliate();toast('✅ Deliveries confirmed — commission released');}
function affTransfer(){const e=affEarnings();if(e.available<=0){toast('Nothing available yet — release delivered orders first');return;}const amt=e.available;e.paid=+(e.paid+amt).toFixed(2);e.available=0;e.sales.forEach(s=>{if(s.status==='released')s.status='paid';});DB.set('lk_affiliate_earnings',e);WALLET.balance=+(WALLET.balance+amt).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Affiliate commission payout',amt);renderAffiliate();render();toast('💸 '+money(amt)+' commission → Wallet');}

const SELLER_TAX_LABEL='Sales Tax';
const SELLER_TAX_RATE=10; // fixed platform-wide rate — not variable per product or seller-editable
function sellerChargesTax(){ return DB.get('lk_seller_charges_tax', true); }
function sellerOrderTax(o){ return sellerChargesTax() ? +(o.total*SELLER_TAX_RATE/100).toFixed(2) : 0; }
function sellerOrderCommission(o){ return o.promoter&&o.commRate?+(o.total*o.commRate/100).toFixed(2):0; }
function sellerCommissionByProduct(){
  const map={};
  SELLER_ORDERS.forEach(o=>{
    const c=sellerOrderCommission(o);
    if(!map[o.item])map[o.item]={item:o.item,category:o.category,sales:0,commission:0,promoters:{}};
    const m=map[o.item];
    m.sales+=o.total;
    if(c>0){
      m.commission=+(m.commission+c).toFixed(2);
      if(!m.promoters[o.promoter])m.promoters[o.promoter]={promoter:o.promoter,commission:0,orders:0,paid:false,pending:false};
      const pr=m.promoters[o.promoter];
      pr.commission=+(pr.commission+c).toFixed(2);
      pr.orders+=1;
      if(o.status==='Delivered')pr.paid=true; else pr.pending=true;
    }
  });
  return Object.values(map).map(m=>Object.assign({},m,{promoters:Object.values(m.promoters)}));
}
function sellerCommissionTotals(){
  const withComm=SELLER_ORDERS.filter(o=>sellerOrderCommission(o)>0);
  const total=+withComm.reduce((a,o)=>a+sellerOrderCommission(o),0).toFixed(2);
  const paid=+withComm.filter(o=>o.status==='Delivered').reduce((a,o)=>a+sellerOrderCommission(o),0).toFixed(2);
  return {total, paid, pending:+(total-paid).toFixed(2), count:withComm.length, promotersCount:new Set(withComm.map(o=>o.promoter)).size};
}

function toggleProductListed(id){

function deleteProductListing(id){

/* ---- Multi-currency FX (home wallet = USD) ---- */
const MY_CCY='USD';
const CCY=[
  {code:'USD',sym:'$',mode:'pegged',rate:1,bps:0},
  {code:'BSD',sym:'B$',mode:'pegged',rate:1,bps:0},
  {code:'XCD',sym:'EC$',mode:'pegged',rate:2.70,bps:0},
  {code:'BBD',sym:'Bds$',mode:'pegged',rate:2.00,bps:0},
  {code:'TTD',sym:'TT$',mode:'floating',rate:6.78,bps:150},
  {code:'JMD',sym:'J$',mode:'floating',rate:157,bps:150},
  {code:'COP',sym:'COL$',mode:'floating',rate:4000,bps:200}
];
function ccyOf(code){return CCY.find(c=>c.code===code)||null;}
function ccySym(code){const c=ccyOf(code);return c&&c.sym?c.sym:code+' ';}
function appFx(amount,from,to){if(from===to)return Math.round(amount*100)/100;const f=ccyOf(from),t=ccyOf(to);if(!f||!t)return null;return Math.round((amount/f.rate)*t.rate*(1-t.bps/10000)*100)/100;}
function fmtCcy(amount,code){if(amount==null)return'—';return ccySym(code)+Number(amount).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fxPreviewHTML(person,amt){
  if(!person||!amt||amt<=0)return'';
  const to=person.ccy||MY_CCY;
  if(to===MY_CCY) return `<div class="rounded-2xl p-3 text-[12px]" style="background:#ecfdf5;border:1px solid #a7f3d0"><b class="text-emerald-700">Domestic · same currency</b><p class="text-slate-500 mt-0.5">No FX. ${person.name} receives ${fmtCcy(amt,MY_CCY)}.</p></div>`;
  const got=appFx(amt,MY_CCY,to),cc=ccyOf(to)||{},one=appFx(1,MY_CCY,to);
  return `<div class="rounded-2xl p-3 text-[12px]" style="background:#eff6ff;border:1px solid #bfdbfe">
    <div class="flex items-center justify-between"><b class="text-blue-700">International transfer</b><span class="text-[10px] font-black uppercase px-2 py-0.5 rounded-full ${cc.mode==='pegged'?'bg-sky-100 text-sky-700':'bg-amber-100 text-amber-700'}">${cc.mode==='pegged'?'fixed peg':'market rate'}</span></div>
    <p class="text-slate-600 mt-1">${person.name}${person.country?' ('+person.country+')':''} receives <b>${fmtCcy(got,to)}</b></p>
    <p class="text-slate-400 mt-0.5">1 ${MY_CCY} ≈ ${Number(one).toLocaleString(undefined,{maximumFractionDigits:4})} ${to} · LinkUp FX spread included</p></div>`;
}

let _pinNew='', _pinTries=0, _pendSend=null;
function getPin(){return DB.get('lk_send_pin','');}
function hasPin(){return /^\d{4}$/.test(getPin());}
function setPinVal(p){DB.set('lk_send_pin',p);}
function pinBoxes(){return `<div class="flex justify-center gap-3 my-4">${[0,1,2,3].map(i=>`<input id="pin${i}" type="password" inputmode="numeric" maxlength="1" oninput="pinAdv(${i})" onkeydown="pinBack(event,${i})" class="w-14 h-16 text-center text-3xl font-black rounded-2xl border-2 border-slate-200 outline-none focus:border-blue-500"/>`).join('')}</div>`;}
function pinAdv(i){const e=$('pin'+i);if(e){e.value=(e.value||'').replace(/\D/g,'').slice(0,1);if(e.value&&i<3){const n=$('pin'+(i+1));if(n)n.focus();}}}
function pinBack(ev,i){if(ev.key==='Backspace'&&!($('pin'+i)||{}).value&&i>0){const p=$('pin'+(i-1));if(p){p.focus();p.value='';}}}
function pinRead(){return [0,1,2,3].map(i=>($('pin'+i)||{}).value||'').join('');}
function pinClear(){[0,1,2,3].forEach(i=>{const e=$('pin'+i);if(e)e.value='';});const f=$('pin0');if(f)f.focus();}
function pinErr(m){const e=$('pinErr');if(e)e.textContent=m||'';}
function pinScreen(stage){
  const meta={verifyCurrent:['Enter current PIN','Confirm it’s you','lock'],enterNew:['Create a 4-digit PIN','Used every time you send money','shield'],confirmNew:['Re-enter your PIN','Confirm your new PIN','shield-check'],sendVerify:['Enter your PIN','to send '+money(_pendSend?_pendSend.amt:0),'lock']}[stage];
  openModal(`<div class="p-5 text-white" style="background:linear-gradient(135deg,#0b2942,#1e3a5f)"><div class="flex items-center justify-between"><h3 class="text-xl font-black">Transaction PIN</h3><button onclick="pinCancel()"><i data-lucide="x" class="w-5 h-5"></i></button></div></div>
    <div class="p-6 text-center"><div class="h-14 w-14 rounded-2xl mx-auto grid place-items-center text-white" style="background:var(--lk-blue)"><i data-lucide="${meta[2]}" class="w-6 h-6"></i></div>
    <p class="font-black text-lg mt-3">${meta[0]}</p><p class="text-sm text-slate-500">${meta[1]}</p>
    ${pinBoxes()}<p id="pinErr" class="text-[12px] font-bold text-rose-600 h-4"></p>
    <button onclick="pinSubmit('${stage}')" class="btn btn-primary w-full mt-3 py-3">Continue</button></div>`);
  setTimeout(()=>{const f=$('pin0');if(f)f.focus();},60);
}
function pinCancel(){_pinNew='';_pendSend=null;_pinTries=0;closeModal();}
function openPinSetup(){_pinNew='';_pendSend=null;pinScreen(hasPin()?'verifyCurrent':'enterNew');}
function pinSubmit(stage){
  const v=pinRead();
  if(!/^\d{4}$/.test(v)){pinErr('Enter all 4 digits');return;}
  if(stage==='verifyCurrent'){if(v!==getPin()){pinErr('Incorrect PIN');pinClear();return;}pinScreen('enterNew');return;}
  if(stage==='enterNew'){_pinNew=v;pinScreen('confirmNew');return;}
  if(stage==='confirmNew'){if(v!==_pinNew){_pinNew='';pinScreen('enterNew');setTimeout(()=>pinErr('PINs didn’t match — try again'),90);return;}setPinVal(v);_pinNew='';if(_pendSend){doSend(_pendSend);}else{closeModal();toast('🔒 Transaction PIN saved');}return;}
  if(stage==='sendVerify'){if(v!==getPin()){_pinTries++;pinClear();if(_pinTries>=3){_pinTries=0;closeModal();toast('Too many attempts — transfer cancelled');return;}pinErr('Incorrect PIN · '+(3-_pinTries)+' left');return;}_pinTries=0;doSend(_pendSend);return;}
}
