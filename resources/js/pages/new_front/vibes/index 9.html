  openModal(`<div class="p-5 text-white" style="background:linear-gradient(135deg,#0b2942,#1e3a5f)"><div class="flex items-center justify-between"><h3 class="text-xl font-black">Requested Money</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><p class="text-white/70 text-xs mt-1">See who’s asking before you pay.</p></div>
  <div class="p-4 space-y-2">${reqs.map(r=>`<div class="flex items-center gap-3 border border-slate-100 rounded-2xl p-3"><img src="${r.img}" class="h-11 w-11 rounded-full object-cover"/><div class="flex-1 min-w-0"><p class="font-black text-sm">${r.name}</p><p class="text-[11px] text-slate-400">${r.kind}</p></div><span class="font-black">${money(r.amt)}</span>${r.status==='Pending'?`<button onclick="payRequest('${r.name.replace(/'/g,'')}',${r.amt})" class="btn btn-primary px-3 py-1.5 text-xs">Pay</button>`:'<span class="rounded-full bg-emerald-100 text-emerald-700 px-2 py-0.5 text-[10px] font-black">Paid</span>'}</div>`).join('')}</div>`);}
function payRequest(name,amt){if(WALLET.balance<amt){toast('Insufficient balance');return;}WALLET.balance=+(WALLET.balance-amt).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Paid '+name,-amt);closeModal();render();toast('✅ Paid '+money(amt)+' to '+name);}
/* --- Pay bills --- */
function openPayBills(){const paid=DB.get('lk_bill_paid',{});openModal(`<div class="p-5 flex items-center justify-between"><h3 class="text-xl font-black">Pay Bills</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="p-4 pt-0 space-y-2">${BILLERS.map(b=>`<div class="flex items-center gap-3 border border-slate-100 rounded-2xl p-3"><span class="h-9 w-9 rounded-full bg-sky-50 grid place-items-center text-sky-500"><i data-lucide="${b.icon}" class="w-4 h-4"></i></span><div class="flex-1 min-w-0"><p class="font-black text-sm">${b.name}</p><p class="text-[11px] text-slate-400">${paid[b.id]?'✅ Paid '+money(paid[b.id]):b.due}</p></div>${paid[b.id]?'<span class="rounded-full bg-emerald-50 text-emerald-600 px-3 py-1.5 text-xs font-black">✓ Paid</span>':`<button onclick="openPayBill('${b.id}')" class="btn bg-sky-500 text-white px-3 py-1.5 text-xs">Pay</button>`}</div>`).join('')}</div>`);}
function openPayBill(id){const b=BILLERS.find(x=>x.id===id);openModal(`<div class="p-5"><div class="flex items-center justify-between mb-4"><h3 class="text-xl font-black">${b.name}</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <input id="billAmt" type="number" placeholder="Amount (USD)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 font-black text-lg outline-none focus:border-lkblue"/>
  <button onclick="payBill('${id}')" class="btn btn-primary w-full mt-3 py-3">Pay ${b.name}</button></div>`);}
function payBill(id){const b=BILLERS.find(x=>x.id===id);const v=parseFloat(($('billAmt')||{}).value);if(!v||v<=0){toast('Enter an amount');return;}if(WALLET.balance<v){toast('Insufficient balance');return;}WALLET.balance=+(WALLET.balance-v).toFixed(2);DB.set('lk_wallet',WALLET);const paid=DB.get('lk_bill_paid',{});paid[id]=v;DB.set('lk_bill_paid',paid);pushTx('Bill · '+b.name,-v);closeModal();render();toast('🧾 Paid '+money(v)+' to '+b.name);}
/* --- Merchant pay --- */
function openMerchant(){openModal(`<div class="p-5"><div class="flex items-center justify-between mb-3"><h3 class="text-xl font-black">Merchant Pay</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="rounded-2xl bg-slate-900 text-white/70 p-6 text-center mb-3"><i data-lucide="scan-line" class="w-10 h-10 mx-auto"></i><p class="font-bold text-sm mt-2">Scan merchant QR to pay</p></div>
  <input id="merchName" value="The Stop & Shop" class="w-full rounded-2xl border border-slate-200 px-4 py-3 mb-2 font-bold outline-none focus:border-lkblue"/>
  <input id="merchAmt" type="number" placeholder="Amount (USD)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 font-black text-lg outline-none focus:border-lkblue"/>
  <button onclick="payMerchant()" class="btn btn-primary w-full mt-3 py-3">Pay Merchant</button></div>`);}
function payMerchant(){const n=($('merchName')||{}).value||'Merchant';const v=parseFloat(($('merchAmt')||{}).value);if(!v||v<=0){toast('Enter an amount');return;}if(WALLET.balance<v){toast('Insufficient balance');return;}WALLET.balance=+(WALLET.balance-v).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Merchant · '+n,-v);closeModal();render();toast('🏪 Paid '+money(v)+' to '+n);}
/* --- Transfer --- */
function openTransfer(){openModal(`<div class="p-5"><div class="flex items-center justify-between mb-3"><h3 class="text-xl font-black">Transfer</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="grid grid-cols-3 gap-2 text-center text-xs font-black">
    <button onclick="openTransferBank()" class="rounded-2xl border-2 border-slate-200 py-4 hover:border-lkblue"><i data-lucide="building-2" class="w-5 h-5 mx-auto"></i><p class="mt-1">To Bank</p></button>
    <button onclick="openSaveDeposit()" class="rounded-2xl border-2 border-slate-200 py-4 hover:border-emerald-400"><i data-lucide="piggy-bank" class="w-5 h-5 mx-auto text-emerald-500"></i><p class="mt-1">To Save</p></button>
    <button onclick="openTopUp('coins')" class="rounded-2xl border-2 border-slate-200 py-4 hover:border-amber-400"><i data-lucide="gem" class="w-5 h-5 mx-auto text-amber-500"></i><p class="mt-1">To Coins</p></button>
  </div></div>`);}
function openTransferBank(){openModal(`<div class="p-5"><div class="flex items-center justify-between mb-3"><h3 class="text-xl font-black">Transfer to Bank</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="flex items-center justify-between rounded-2xl bg-slate-50 px-4 py-3 mb-2"><span class="font-black text-slate-500">Available</span><span class="font-black text-lg">${money(WALLET.balance)}</span></div>
  <input id="tbAmt" type="number" oninput="tbCalc()" placeholder="Amount (USD)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 font-black text-lg outline-none focus:border-lkblue"/>
  <select id="tbDest" class="w-full rounded-2xl border border-slate-200 px-4 py-3 mt-2 font-bold outline-none"><option>Scotiabank ••4471</option><option>RBC ••8830</option></select>
  <div class="rounded-2xl bg-amber-50 border border-amber-200 p-3 text-amber-800 mt-2"><p class="font-bold text-sm">5% bank processing fee applies.</p><p id="tbCalcL" class="text-[12px] mt-1">You withdraw $0.00 • Fee $0.00 • You receive $0.00</p></div>
  <button onclick="doWithdraw()" class="btn w-full mt-3 py-3 text-white" style="background:#0b2942">Confirm Withdrawal</button></div>`);}
function tbCalc(){const v=parseFloat(($('tbAmt')||{}).value)||0;const fee=v*0.05;const el=$('tbCalcL');if(el)el.textContent=`You withdraw ${money(v)} • Fee ${money(fee)} • You receive ${money(v-fee)}`;}
function doWithdraw(){const v=parseFloat(($('tbAmt')||{}).value);if(!v||v<=0){toast('Enter an amount');return;}if(v>WALLET.balance){toast('Exceeds balance');return;}const fee=v*0.05;WALLET.balance=+(WALLET.balance-v).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Transfer to bank',-v);closeModal();render();toast('🏦 Withdrew '+money(v)+' (−'+money(fee)+' fee)');}
/* --- Top up --- */
function openTopUp(tab){tab=tab||'cash';const tabs=`<div class="grid grid-cols-2 bg-slate-100 rounded-2xl p-1 font-black text-sm mb-3"><button onclick="openTopUp('cash')" class="rounded-xl py-3 ${tab==='cash'?'bg-white shadow':'text-slate-500'}">Top Up Cash</button><button onclick="openTopUp('coins')" class="rounded-xl py-3 ${tab==='coins'?'bg-white shadow':'text-slate-500'}">Buy Coins</button></div>`;
  const body=tab==='cash'?`<input id="tuAmt" type="number" placeholder="Amount (USD)" class="w-full rounded-2xl border border-slate-200 px-4 py-4 font-black text-2xl outline-none focus:border-lkblue"/><button onclick="addFunds()" class="btn btn-primary w-full mt-3 py-4 text-lg">Add Funds</button>`
    :`<div class="grid grid-cols-2 gap-3">${[[100,1],[550,5],[1200,10],[3000,25]].map(p=>`<button onclick="buyCoins(${p[0]},${p[1]})" class="rounded-2xl border border-slate-200 p-4 text-left hover:border-amber-300"><p class="font-black text-xl">${num(p[0])} 🪙</p><p class="text-slate-400 font-bold">$${p[1]}</p></button>`).join('')}</div>`;
  openModal(`<div class="p-5 flex items-center justify-between"><h3 class="text-2xl font-black">Wallet Top Up</h3><button onclick="closeModal()"><i data-lucide="x" class="w-6 h-6"></i></button></div><div class="p-4 pt-0">${tabs}${body}</div>`);}
function addFunds(){const v=parseFloat(($('tuAmt')||{}).value);if(!v||v<=0){toast('Enter an amount');return;}WALLET.balance=+(WALLET.balance+v).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Top Up · Card',v);closeModal();render();toast('💳 Added '+money(v));}
function buyCoins(luc,usd){if(WALLET.balance<usd){toast('Insufficient balance — top up first');return;}WALLET.coins+=luc;WALLET.balance=+(WALLET.balance-usd).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Bought '+num(luc)+' coins',-usd);closeModal();render();toast('💎 +'+num(luc)+' coins');}
/* --- Cards / Activity / Contacts --- */
function openCards(){const card=DB.get('lk_my_card',{last4:'4471',exp:'08/28'});openModal(`<div class="p-5"><div class="flex items-center justify-between mb-4"><h3 class="text-xl font-black">My Cards</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
  <div class="rounded-3xl p-5 text-white" style="background:linear-gradient(135deg,#0b2942,#2f9bef)"><div class="flex justify-between items-start"><span class="logo text-xl">Link<span style="color:#F5C518">üp</span></span><i data-lucide="wifi" class="w-5 h-5"></i></div><p class="tracking-[0.2em] text-lg mt-6">•••• •••• •••• ${card.last4||'4471'}</p><div class="flex justify-between mt-3 text-sm"><span>${USER.name}</span><span>${card.exp||'08/28'}</span></div></div>
  <button onclick="toast('❄ Card frozen')" class="btn btn-ghost w-full mt-3 py-3">Freeze card</button>
  <button onclick="toast('➕ Virtual card created')" class="btn btn-primary w-full mt-2 py-3">Create virtual card</button></div>`);}
function openActivity(){const x=DB.get('lk_wallet_txns',[]);openModal(`<div class="p-5 flex items-center justify-between"><h3 class="text-xl font-black">Activity</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-4 pt-0 space-y-2 max-h-[60vh] overflow-y-auto">${x.length?x.map(t=>`<div class="flex items-center justify-between border border-slate-100 rounded-2xl p-3"><div><p class="font-bold text-sm">${t.t}</p><p class="text-[11px] text-slate-400">${t.d}</p></div><span class="font-black ${t.a<0?'text-rose-600':'text-emerald-600'}">${t.a<0?'−':'+'}${money(Math.abs(t.a))}</span></div>`).join(''):'<p class="text-center text-slate-400 py-8 font-bold">No activity yet.</p>'}</div>`);}
let acQuery='', acResults=[], acNickname='', acPicked=null;
function openAddContact(){acQuery='';acResults=[];acNickname='';acPicked=null;renderAddContact(true);}
function acSearch(v){
  acQuery=v; acPicked=null; const q=v.trim().toLowerCase().replace(/^[@~]/,'');
  if(!q){acResults=[];renderAddContact(false);return;}
  const existing=DB.get('lk_wallet_contacts',WCONTACTS).map(c=>c.tag);
  acResults=LINKUP_USERS.filter(u=>{const t=u.tag.toLowerCase().replace(/^@/,'');return t.includes(q)||u.name.toLowerCase().includes(q);})
    .filter(u=>!existing.includes(u.tag)&&u.tag!==USER.handle).slice(0,6);
  renderAddContact(false);
}
function acSetName(v){acNickname=v;acUpdateSaveBtn();}
function acUpdateSaveBtn(){
  const btn=$('acSaveBtn'); if(!btn) return;
  const ready=!!(acNickname.trim()&&acPicked);
  btn.disabled=!ready;
  btn.className='btn w-full mt-4 py-3 '+(ready?'btn-primary':'bg-slate-200 text-slate-400');
}
function acSelect(tag){
  const u=LINKUP_USERS.find(x=>x.tag===tag); if(!u)return;
  acPicked=u; acQuery=u.tag;
  renderAddContact(false);
  const ni=$('acNickname'); if(ni && !ni.value) ni.focus();
}
function acSaveContact(){
  const nickname=(acNickname||'').trim();
  if(!nickname||!acPicked){toast('Enter a name and pick a LinkTag first');return;}
  const cs=DB.get('lk_wallet_contacts',WCONTACTS.slice());
  if(cs.some(c=>c.tag===acPicked.tag)){toast('Already in your Quick Pay list');return;}
  cs.push(Object.assign({},acPicked,{nickname})); DB.set('lk_wallet_contacts',cs);
  closeModal(); render(); toast('✅ '+nickname+' added to Quick Pay');
}
function renderAddContact(reopen){
  const ready=!!(acNickname.trim()&&acPicked);
  const html=`<div class="p-5">
    <div class="flex items-center justify-between mb-4"><h3 class="text-xl font-black">Add Contact</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <label class="text-xs font-black text-slate-500 uppercase tracking-wide">Name</label>
    <input id="acNickname" value="${acNickname}" oninput="acSetName(this.value)" placeholder="e.g. Dad" class="w-full rounded-2xl border border-slate-200 px-4 py-3 mt-1 font-bold outline-none focus:border-lkblue" autocomplete="off"/>
    <label class="text-xs font-black text-slate-500 uppercase tracking-wide mt-4 block">LinkTag Search</label>
    <div class="relative mt-1"><input id="acTag" value="${acQuery}" oninput="acSearch(this.value)" placeholder="e.g. ~Dad" class="w-full rounded-2xl border border-slate-200 px-4 py-3 pr-10 font-bold outline-none focus:border-lkblue" autocomplete="off"/><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2"></i></div>
    <div class="mt-3 space-y-1.5 max-h-56 overflow-y-auto">
      ${acPicked?`<div class="flex items-center gap-3 rounded-2xl border-2 border-lkblue/30 bg-blue-50 p-2.5"><img src="${acPicked.img}" class="h-11 w-11 rounded-full object-cover"/><div class="min-w-0 flex-1"><p class="font-black text-sm truncate">${acPicked.name}</p><p class="text-[11px] text-slate-400">${acPicked.tag}</p></div><i data-lucide="check-circle-2" class="w-5 h-5 text-lkblue"></i></div>`
        :acQuery.trim()===''?'<p class="text-center text-slate-400 text-sm py-6">Search a LinkTag to find someone on LinkUp.</p>'
        :acResults.length?acResults.map(u=>`<button onclick="acSelect('${u.tag}')" class="w-full flex items-center gap-3 rounded-2xl border border-slate-100 hover:border-lkblue hover:bg-blue-50/40 p-2.5 text-left transition"><img src="${u.img}" class="h-11 w-11 rounded-full object-cover"/><div class="min-w-0 flex-1"><p class="font-black text-sm truncate">${u.name}</p><p class="text-[11px] text-slate-400">${u.tag}</p></div></button>`).join('')
        :'<p class="text-center text-slate-400 text-sm py-6">No LinkUp user matches that LinkTag.</p>'}
    </div>
    <button id="acSaveBtn" onclick="acSaveContact()" ${ready?'':'disabled'} class="btn w-full mt-4 py-3 ${ready?'btn-primary':'bg-slate-200 text-slate-400'}">Save Contact</button>
  </div>`;
  $('modalCard').className='card w-full max-w-md max-h-[85vh] overflow-y-auto fade';
  if(reopen)openModal(html); else {$('modalCard').innerHTML=html; if(window.lucide)lucide.createIcons(); const inp=$('acTag'); if(inp && document.activeElement!==$('acNickname')){inp.focus(); const l=inp.value.length; inp.setSelectionRange(l,l);}}
}
/* --- LinkUp Save module --- */
function saveCard(){const s=getSave();const tier=saveTier(s.balance);const next=savingsConfig.tiers.slice().sort((a,b)=>a.min-b.min).find(x=>x.min>s.balance);
  return `<div class="rounded-3xl p-5 text-white" style="background:linear-gradient(135deg,#059669,#14b8a6)">
    <div class="flex items-center justify-between"><span class="font-black flex items-center gap-2"><i data-lucide="piggy-bank" class="w-5 h-5"></i> LinkUp Save</span><div class="flex items-center gap-2"><button onclick="openSaveHow()" class="h-7 w-7 rounded-full bg-white/20 grid place-items-center font-black">?</button><span class="rounded-full bg-white/20 px-2.5 py-1 text-[10px] font-black">Powered by Scotiabank</span></div></div>
    <p class="text-emerald-50 text-xs mt-3">Available Savings Balance</p><h3 class="text-3xl font-black">${money(s.balance)}</h3>
    <div class="flex flex-wrap gap-4 mt-1 text-xs"><span>Tier <b>${tier.name}</b></span><span>APY <b>${tier.apy.toFixed(1)}%</b></span><span>Earned this month <b>${money(s.earnedMonth)}</b></span></div>
    ${next?`<div class="mt-3"><div class="flex justify-between text-[10px] text-emerald-50 mb-1"><span>${tier.name}</span><span>${next.name} at ${money(next.min)}</span></div><div class="h-1.5 rounded-full bg-white/25"><div class="h-1.5 rounded-full bg-white" style="width:${Math.min(100,Math.round(s.balance/next.min*100))}%"></div></div></div>`:'<p class="text-[10px] text-emerald-50 mt-2">🏆 Top tier — Elite APY.</p>'}
    <div class="flex gap-2 mt-4"><button onclick="openSaveDeposit()" class="flex-1 rounded-2xl bg-white text-emerald-700 py-2.5 font-black text-sm">Deposit</button><button onclick="openSaveWithdraw()" class="flex-1 rounded-2xl bg-white/20 py-2.5 font-black text-sm">Withdraw</button><button onclick="openSaveHistory()" class="rounded-2xl bg-white/20 px-3 py-2.5 font-black"><i data-lucide="history" class="w-4 h-4"></i></button></div>
    <div class="mt-3 flex items-center justify-between bg-white/15 rounded-2xl px-3 py-2"><div class="text-xs"><p class="font-black">Auto-Save</p><p class="text-emerald-50 text-[10px]">Sweep ${s.autoSavePct}% of each payout into savings</p></div><button onclick="openSaveAuto()" class="rounded-full bg-white text-emerald-700 px-3 py-1 text-xs font-black">Edit</button></div>
  </div>`;
}
function openSaveDeposit(){openModal(`<div class="p-5 text-white" style="background:linear-gradient(135deg,#059669,#14b8a6)"><div class="flex items-center justify-between"><h3 class="text-xl font-black">Deposit to Savings</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><p class="text-emerald-50 text-xs mt-1">Wallet available: ${money(WALLET.balance)} · min ${money(savingsConfig.topUpMin)}</p></div>
  <div class="p-4 space-y-3"><div class="grid grid-cols-3 gap-2">${[100,500,1000].map(a=>`<button onclick="document.getElementById('depAmt').value=${a}" class="rounded-xl border-2 border-emerald-100 py-2 font-black text-emerald-700 text-sm">$${a}</button>`).join('')}</div>
  <input id="depAmt" type="number" placeholder="Amount (USD)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 font-black text-lg outline-none focus:border-emerald-400"/>
  <div class="rounded-2xl bg-emerald-50 text-emerald-800 text-xs font-bold p-3">Moves Wallet → LinkUp Save. Interest accrues daily, posts monthly.</div>
  <button onclick="applyDeposit()" class="btn w-full py-3 text-white" style="background:linear-gradient(135deg,#059669,#14b8a6)">Deposit</button></div>`);}
function applyDeposit(){const v=parseFloat(($('depAmt')||{}).value);if(!v||v<savingsConfig.topUpMin){toast('Minimum deposit is '+money(savingsConfig.topUpMin));return;}if(v>WALLET.balance){toast('Not enough wallet balance');return;}const s=getSave();s.balance+=v;setSave(s);WALLET.balance=+(WALLET.balance-v).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Deposit to LinkUp Save',-v);closeModal();render();toast('🐷 '+money(v)+' moved to LinkUp Save');}
function openSaveWithdraw(){const s=getSave();const tier=saveTier(s.balance);openModal(`<div class="p-5 text-white" style="background:linear-gradient(135deg,#059669,#14b8a6)"><div class="flex items-center justify-between"><h3 class="text-xl font-black">Withdraw Savings</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><p class="text-emerald-50 text-xs mt-1">Savings balance: ${money(s.balance)}</p></div>
  <div class="p-4 space-y-3"><input id="wdAmt" type="number" placeholder="Amount (USD)" class="w-full rounded-2xl border border-slate-200 px-4 py-3 font-black text-lg outline-none focus:border-emerald-400"/>
  <div class="rounded-2xl bg-amber-50 text-amber-800 text-xs font-bold p-3">⚠️ Funds locked ${tier.lock||savingsConfig.lockDays} days. Early withdrawal incurs ${savingsConfig.earlyPenalty}% penalty.</div>
  <button onclick="applyWithdraw()" class="btn w-full py-3 text-white" style="background:linear-gradient(135deg,#059669,#14b8a6)">Withdraw to Wallet</button></div>`);}
function applyWithdraw(){const v=parseFloat(($('wdAmt')||{}).value);const s=getSave();if(!v||v<=0){toast('Enter an amount');return;}if(v>s.balance){toast('Exceeds savings balance');return;}const pen=v*savingsConfig.earlyPenalty/100;s.balance-=v;setSave(s);WALLET.balance=+(WALLET.balance+(v-pen)).toFixed(2);DB.set('lk_wallet',WALLET);pushTx('Withdraw from Save',v-pen);closeModal();render();toast('Withdrew '+money(v-pen)+' (−'+money(pen)+' penalty)');}
function openSaveAuto(){const s=getSave();openModal(`<div class="p-5 text-white" style="background:linear-gradient(135deg,#059669,#14b8a6)"><div class="flex items-center justify-between"><h3 class="text-xl font-black">Auto-Save</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div><p class="text-emerald-50 text-xs mt-1">Sweep a % of each payout into savings.</p></div>

// One-tap reaction on a received gift — a lighter alternative to the full Thank You composer
// for when a whole written message feels like overkill. Toggle: tapping the active emoji
// again clears it.
function vibeReactGiftWeb(id,emoji){
  const list=giftActivity();
  const g=list.find(x=>x.id===id); if(!g)return;
  g.reacted=(g.reacted===emoji)?null:emoji;
  saveGiftActivity(list);
  render();
  if(g.reacted)toast(emoji+' sent to '+g.from);
}
// Cash-outs are tracked separately from the gift activity feed (a conversion isn't itself a
// "sent gift"), so availableToConvert = lifetime received coins minus whatever's already been
// cashed out — without this, converting wouldn't actually reduce what's left to convert.
function giftConversions(){return DB.get('lk_gift_conversions',[]);}
function saveGiftConversions(list){DB.set('lk_gift_conversions',list);}
function giftStats(){
  const list=giftActivity();
  const sent=list.filter(g=>g.type==='SENT'), recv=list.filter(g=>g.type==='RECEIVED');
  const sentCoins=sent.reduce((a,g)=>a+g.coins,0), recvCoins=recv.reduce((a,g)=>a+g.coins,0);
  const byGift={}; recv.forEach(g=>byGift[g.gift]=(byGift[g.gift]||0)+1);
  const top=Object.entries(byGift).sort((a,b)=>b[1]-a[1]);
  const convertedCoins=giftConversions().reduce((a,c)=>a+c.coins,0);
  const availableToConvert=Math.max(0,recvCoins-convertedCoins);
  return {sentCoins,recvCoins,sentCount:sent.length,recvCount:recv.length,net:recvCoins-sentCoins,top,convertedCoins,availableToConvert};
}

  row[dir==='SENT'?'to':'from']=who;
  list.unshift(row);
  saveGiftActivity(list);
}

// Mirrors the Consumer App's gcCalc: live-updates the "you will receive"/"platform share"
// preview for whatever amount is typed. The "Meets minimum?" indicator above is deliberately
// NOT recomputed here — like the source, it reflects overall eligibility (can you convert your
// full available balance at all), not the specific amount currently typed.
function gcCalc(){
  const el=$('gcAmt'), youEl=$('gcYou'), platEl=$('gcPlat'); if(!el) return;
  const gs=giftStats();
  let amt=parseInt(el.value)||0;
  if(amt>gs.availableToConvert){amt=gs.availableToConvert; el.value=amt;}
  if(amt<0){amt=0; el.value=0;}
  const gross=amt*GIFT_COIN_VALUE, you=gross*GIFT_CASH_SHARE, plat=gross*GIFT_CASH_SHARE;
  if(youEl) youEl.textContent=money(you);
  if(platEl) platEl.textContent=money(plat);
}
function doConvertGift(){
  const el=$('gcAmt'); const gs=giftStats(); const amt=parseInt(el&&el.value)||0;
  if(amt<=0){toast('Enter a coin amount');return;}
  if(amt>gs.availableToConvert){toast('You only have '+num(gs.availableToConvert)+' coins available.');return;}
  const net=+(amt*GIFT_COIN_VALUE*GIFT_CASH_SHARE).toFixed(2);
  if(net<GIFT_CASH_MIN_USD){toast('Below '+money(GIFT_CASH_MIN_USD)+' cash-out minimum');return;}
  const conv=giftConversions(); conv.unshift({id:'GC-'+Date.now(),coins:amt,netUsd:net,date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}); saveGiftConversions(conv);
  WALLET.balance=+(WALLET.balance+net).toFixed(2); DB.set('lk_wallet',WALLET);
  pushTx('Gift coins converted to cash',net);
  toast('💵 Converted '+num(amt)+' coins to '+money(net));
  render();
}

/* Occasionally a burst of concurrent image requests drops one — retry with a cache-busting
   param (a same-URL retry can just replay a cached empty/broken response) before giving up. */
document.addEventListener('error', function(e){
  const img=e.target;
  if(img && img.tagName==='IMG' && img.src.includes('images.unsplash.com')){
    const tries=(img.dataset.retries||0)*1;
    if(tries<3){ img.dataset.retries=tries+1; const base=img.src.split('&_r=')[0]; setTimeout(()=>{img.src=base+'&_r='+Date.now();},300*(tries+1)); }
  }
}, true);

function lkUserId(){
  let id; try { id = localStorage.getItem('lk_user_id'); } catch(e) {}
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('lk-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2));
    try { localStorage.setItem('lk_user_id', id); } catch(e) {}
  }
  return id;
}
function wsFinish(){
  const parts = (wsData.liveLabel || '').split(', ');
  const city = parts[0] || '';
  const country = parts[1] || '';
  const handle = wsData.handle ? (wsData.handle.startsWith('@') ? wsData.handle : '@' + wsData.handle) : ('@' + (wsData.firstName || 'user').toLowerCase().replace(/[^a-z0-9]/g, ''));

  const p = {
    firstName: wsData.firstName, lastName: wsData.lastName, linkupId: handle, email: wsData.email,
    country, city, phone: wsData.phone || '', dob: wsData.dob || '', gender: wsData.gender || '',
    distanceKm: wsData.dist, ageRange: wsData.age, seeking: wsData.seeking || '',
    profession: wsData.profession || '', university: wsData.university || '', religion: wsData.religion || '',
    interests: wsData.interests, intent: wsData.intent || '', bio: wsData.bio || '',
    hasPhoto: !!wsData.photo, createdAt: new Date().toISOString()
  };
  // Same "contract, no real backend yet" pattern used everywhere else in this project —
  // see 01-Consumer App/LinkUp-App.html's onbSubmitSignup() and LK_API in the phone app.
  try { fetch(LINKUP_WEB + '/api/user/signup', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p)}).catch(function(){}); } catch (e) {}

  Object.assign(USER, {
    name: (wsData.firstName + ' ' + wsData.lastName).trim(), handle,
    city, country, flag: wsData.liveFlag || USER.flag,
    dob: wsData.dob, gender: wsData.gender, phone: wsData.phone,
    seeking: wsData.seeking, ageRange: wsData.age, distanceKm: wsData.dist,
    profession: wsData.profession, university: wsData.university, religion: wsData.religion,
    interests: wsData.interests, intent: wsData.intent, bio: wsData.bio,
    avatar: wsData.photo || USER.avatar
  });
  DB.set('lk_user', USER);
  // password is intentionally not persisted here — this is a client-side prototype with
  // no real backend; real auth (hashing, session tokens) has to happen server-side.
  DB.set('lk_account', {name: USER.name, email: wsData.email, handle});

  finishAuthGate();
}

function finishAuthGate(){
  DB.set('lk_signed_up', true);
  authGateHide();
  buildSidebar();
  go('home');
  toast('🎉 Welcome to LinkUp, ' + (USER.name || 'friend') + '!');
}


buildSidebar();
if (!authGateBoot()) { go('home'); }
</script>
